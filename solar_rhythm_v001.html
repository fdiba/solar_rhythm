<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE 25th CYCLE · solar rhythm</title>
<meta name="author" content="Florent Di Bartolo (ORCID 0000-0002-4910-6936)">
<meta name="license" content="CC BY-NC-SA 4.0, https://creativecommons.org/licenses/by-nc-sa/4.0/">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
<style>

:root{
  --bg:#0e1012; --panel:#16191d; --panel2:#1d2126; --line:#2a2f36;
  --txt:#e6e9ec; --dim:#8b949e; --accent:#ff8a3d; --accent2:#4db6ff;
  --green:#3ddc84; --red:#ff5d5d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
header .sub{color:var(--dim);font-size:12px}
header .ver{margin-left:auto;font:11px var(--mono);color:var(--dim)}
main{padding:18px;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr));align-items:start;max-width:1500px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
section h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:0 0 12px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.row label{min-width:110px;color:var(--dim);font-size:12px}
.row .val{font:12px var(--mono);color:var(--accent);min-width:46px;text-align:right}
input[type=range]{flex:1;min-width:110px;accent-color:var(--accent)}
input[type=number],input[type=text],select{background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px var(--mono)}
input[type=text]{flex:1;min-width:120px}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:8px 14px;font:12px/1 system-ui;cursor:pointer}
button:hover{border-color:#3d444d}
button.seg.on{background:var(--accent);border-color:var(--accent);color:#12140f;font-weight:600}
#play{font-size:15px;font-weight:700;padding:14px 20px;letter-spacing:.1em;width:100%}
#play.on{background:var(--green);border-color:var(--green);color:#06170e}
#panic{border-color:#54303a;color:#ff9d9d}
.seggrp{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:6px}
.cell{aspect-ratio:1;border-radius:3px;background:#22272d;border:1px solid #2b3138;
  display:flex;align-items:center;justify-content:center;font:9px var(--mono);color:#4c545d}
.cell.q{background:#2b3138}
.cell.m{border-color:var(--accent2)}
.cell.on{background:var(--accent);color:#12140f;border-color:var(--accent);box-shadow:0 0 12px rgba(255,138,61,.55)}
.leds{display:flex;gap:5px;margin:10px 0 2px}
.led{width:12px;height:12px;border-radius:50%;background:#262c33;border:1px solid #333a42}
.led.on{background:var(--accent);box-shadow:0 0 9px var(--accent)}
.big{font:28px/1.1 var(--mono);color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;font:12px var(--mono);
  padding:5px 0;border-bottom:1px dotted #262c33}
.kv span:last-child{color:var(--accent2)}
.hint{color:var(--dim);font-size:11px;margin:10px 0 0;line-height:1.5}
.degs{font:11px var(--mono);color:var(--dim);line-height:1.7}
.napbox{margin:10px 0 4px;padding:8px 10px;border:1px solid #22272d;border-radius:6px}
.naphd{font-size:12px;margin-bottom:6px}
.napgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--dim)}
.napgrid input{width:64px}
table.bench{width:100%;border-collapse:collapse;margin-top:4px}
table.bench td{padding:4px 6px;border-bottom:1px solid #22272d;vertical-align:middle}
.gn{opacity:.5;font-size:.9em}
table.bench td.o{vertical-align:top;padding-top:6px;padding-bottom:6px}
table.bench td.o .nm{font:12px var(--mono);color:var(--accent2);white-space:nowrap}
table.bench td.o .ds{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.35}
table.bench td.ctl{width:44%;vertical-align:middle}
button.gt{width:100%;padding:5px 8px;font:11px var(--mono)}
button.gt.on{background:var(--green);border-color:var(--green);color:#06170e;font-weight:700}
table.bench input[type=range]{width:100%;vertical-align:middle}
table.bench .cv{display:flex;align-items:center;gap:8px}
table.bench .cv span{font:11px var(--mono);color:var(--accent);min-width:26px;text-align:right}
.degs b{color:var(--accent2);font-weight:400}
.ok{color:var(--green)}
.warn{color:var(--accent)}
.bad{color:var(--red)}
.degs i{color:var(--accent);font-style:normal}
.hint code{font:11px var(--mono);color:#c9d1d9}
#midistat{font:11px var(--mono);padding:6px 9px;border-radius:6px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim)}
#midistat.ok{color:var(--green);border-color:#204a32}
#midistat.err{color:var(--red);border-color:#4a2020}
table.map{width:100%;border-collapse:collapse;font:11px var(--mono)}
table.map td{padding:3px 4px;border-bottom:1px solid #22272d;vertical-align:top}
table.map td:first-child{color:var(--accent2);white-space:nowrap;width:1%}
/* ---- SILSO ---- */
:root{ --s-raw:#59616b; --s-27:#2f8fd6; --s-13:#dd6a22; --s-dev:#8b949e; --head:#e6e9ec; }
section{min-width:0}
section.wide{grid-column:1/-1}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row3{grid-column:1/-1;display:grid;gap:16px;align-items:start;min-width:0;
  grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
section h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
section h2 .h2r{margin-left:auto;letter-spacing:0;text-transform:none;font:11px var(--mono)}
input[type=date]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;font:13px var(--mono);color-scheme:dark}
.huge{font:40px/1 var(--mono);color:var(--txt)}
.stepbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepbtns button{padding:8px 4px;font:12px var(--mono)}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-height:22px;margin:8px 0 2px}
.tag{font:11px var(--mono);padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.tag.def{color:var(--green);border-color:#204a32}
.tag.prov{color:var(--accent);border-color:#5a3a20}
.tag.miss{color:var(--red);border-color:#4a2020}
.tag.info{color:var(--accent2);border-color:#1f3a50}
.cycgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cycgrid button{padding:7px 0;font:12px var(--mono)}
.cycgrid button.part{border-style:dashed}
.cycgrid button.on{background:var(--accent);border-color:var(--accent);color:#12140f;font-weight:700}
.posbar{position:relative;height:8px;background:#22272d;border-radius:4px;margin:10px 0 4px;overflow:hidden}
.posbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2);border-radius:4px}
table.st{width:100%;border-collapse:collapse;font:11.5px var(--mono)}
table.st th{font:11px system-ui;color:var(--dim);text-align:right;padding:4px 4px;border-bottom:1px solid var(--line);font-weight:400}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st td{padding:5px 4px;border-bottom:1px solid #22272d;text-align:right;white-space:nowrap}
table.st td small{color:var(--dim);font-size:10px;display:block}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
canvas{display:block;width:100%;cursor:crosshair}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:11px var(--mono);color:var(--dim);margin:0 0 8px}
.plotwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:#0b0d0f;border:1px solid var(--line);border-radius:6px;
  padding:6px 9px;font:11px/1.5 var(--mono);color:var(--txt);white-space:nowrap;display:none;z-index:2}
.tip b{font-weight:400;color:var(--dim)}
#drop{border:1px dashed #3d444d;border-radius:8px;padding:14px;text-align:center;color:var(--dim);font-size:12px;margin-top:10px}
#drop.over{border-color:var(--accent);color:var(--accent);background:#1b1612}
#drop label{color:var(--accent2);cursor:pointer;text-decoration:underline}
#checks .kv span:last-child{color:inherit}
.mod{border:1px solid #22272d;border-radius:8px;padding:9px 10px;margin:8px 0}
.mod .mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mod .mh .nm{font:12px var(--mono);color:var(--accent2)}
.mod .mh .ds{font-size:11.5px;color:var(--dim)}
.mod .mh button{margin-left:auto;padding:5px 10px;font:11px var(--mono)}
.mod .mh button.on{background:var(--green);border-color:var(--green);color:#06170e;font-weight:700}
.mod .mc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--dim)}
.mod .mc select,.mod .mc input{padding:4px 6px;font:12px var(--mono)}
.mod .mc input[type=number]{width:62px}
.mod .mc button{padding:5px 9px;font:11px var(--mono)}
.mbar{position:relative;height:12px;background:#22272d;border-radius:6px;margin-top:8px}
.mbar .win{position:absolute;top:0;bottom:0;background:#2b3138;border-radius:6px}
.mbar .pos{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1px;border-radius:2px;background:var(--txt)}
.mod.off .mbar .pos{background:var(--dim)}
.mval{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim);margin-top:4px}
.mval b{color:var(--accent);font-weight:400}
table.bench input[type=range].auto{accent-color:var(--green)}
@media (max-width:600px){main{padding:12px 16px}header{padding:12px 16px}}
/* ---- FORME ---- */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px}
@media (max-width:900px){.fgrid{grid-template-columns:1fr}}
.fbar{position:relative;height:14px;background:linear-gradient(90deg,#1b2633,#1d2a24 40%,#2b2418 80%,#33231a);border-radius:7px;margin:12px 0 2px}
.fbar #fTicks i{position:absolute;top:-3px;bottom:-3px;width:1px;background:#4c545d}
.fbar #fTicks i.cx{width:2px;background:#4f9ab3}
.fbar .pos{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;border-radius:2px;background:var(--txt)}
.fbands{display:grid;grid-template-columns:repeat(5,1fr);font:10px var(--mono);color:var(--dim);text-align:center;margin-bottom:6px}
#fBtns button{padding:7px 12px;font:12px var(--mono)}
table.ft{width:100%;border-collapse:collapse;font:12px var(--mono)}
table.ft th{font:11px var(--mono);color:var(--dim);font-weight:400;padding:4px;border-bottom:1px solid var(--line);text-align:center}
table.ft th:first-child{text-align:left}
table.ft td{padding:4px;border-bottom:1px solid #22272d;text-align:center;vertical-align:middle}
table.ft td:first-child{text-align:left}
table.ft tr.grp th{text-align:left;color:var(--accent2);padding-top:10px}
table.ft td .nm{display:block;font:11.5px var(--mono);color:var(--accent2);white-space:nowrap}
table.ft td .ds{display:block;font-size:11px;color:var(--dim)}
table.ft input[type=number]{width:54px;padding:4px 5px;font:12px var(--mono)}
table.ft input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
table.ft .cur{background:#1b1612}
table.ft th.cur{color:var(--accent)}
table.bench input[type=range].forme{accent-color:var(--accent2)}

/* ---- SOLAR ---- */
header .langs{display:flex;gap:4px;margin-left:auto}
header .langs button{padding:4px 9px;font:11px var(--mono)}
header .ver{margin-left:12px}
footer{max-width:1500px;padding:6px 20px 28px;color:var(--dim);font-size:11.5px;line-height:1.6}
footer a{color:var(--accent2)}
table.rgrid{border-collapse:separate;border-spacing:3px;font:10px var(--mono);margin:2px 0 8px}
table.rgrid th{color:var(--dim);font-weight:400;padding:0 0 2px;text-align:center;min-width:24px}
table.rgrid th.q{color:var(--txt)}
table.rgrid td.lb{padding-right:8px;white-space:nowrap;font:11.5px var(--mono);color:var(--accent2);text-align:left}
table.rgrid td.c{width:24px;height:22px;border-radius:3px;background:#1c2025;border:1px solid #262c33}
table.rgrid td.c.q{background:#22272d}
table.rgrid td.c.on{background:var(--accent);border-color:var(--accent)}
table.rgrid td.c.on.mut{background:#c9a227;border-color:#c9a227}
table.rgrid td.c.on.drone{background:#6a5acd;border-color:#6a5acd}
table.rgrid td.c.fill{background:#2f4f5c;border-color:#3f6878}
table.rgrid tr.off td.c.fill{background:#2a3338;border-color:#2a3338}
table.rgrid td.c.miss{background:repeating-linear-gradient(45deg,#1c2025 0 3px,#2a2f36 3px 5px)}
table.rgrid tr.off td.c.on{background:#5a4030;border-color:#5a4030}
table.rgrid td.c.now{outline:2px solid var(--txt);outline-offset:0}
table.rgrid tr.days td.c{background:none;border:0;height:auto;color:var(--dim);text-align:center}
.voice{display:grid;grid-template-columns:150px auto 1fr;gap:6px 12px;align-items:center;
  padding:8px 10px;border:1px solid #22272d;border-radius:8px;margin:6px 0}
.voice .vn{font:12px var(--mono);color:var(--accent2)}
.voice .vn small{display:block;color:var(--dim);font-size:11px}
.voice .vc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.voice .vc select,.voice .vc input{padding:4px 6px;font:12px var(--mono)}
.voice .vc input[type=number]{width:62px}
.voice .vd{font:11px var(--mono);color:var(--dim);text-align:right}
.voice .vd b{color:var(--accent);font-weight:400}
.voice button.on{background:var(--green);border-color:var(--green);color:#06170e;font-weight:700}
@media (max-width:760px){.voice{grid-template-columns:1fr}.voice .vd{text-align:left}}
/* rythme solaire et cycle en cours : 3 colonnes de la page sur 4, les timbres SILSO a cote
   (sur la hauteur des deux blocs) ; pleine largeur des que la page a moins de 4 colonnes */
section.rh{grid-column:1/-1}
@media (min-width:1340px){section.rh{grid-column:span 3}section.side2{grid-column:4;grid-row:span 2}}

.row2{grid-column:1/-1;display:grid;gap:16px;align-items:start;min-width:0;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}

</style>
</head>
<body>
<header>
  <h1>The 25th Cycle</h1>
  <span class="sub" data-i18n="sub"></span>
  <span class="langs"><button class="seg" data-lang="fr">FR</button><button class="seg" data-lang="en">EN</button></span>
  <span class="ver">SOLAR-v034</span>
</header>

<main>

<section class="wide">
  <h2><span data-i18n="ov_title"></span> <span class="h2r" id="ovInfo"></span></h2>
  <div class="legend">
    <span><span class="sw" style="background:var(--s-raw)"></span><span data-i18n="lg_raw_env"></span></span>
    <span><span class="sw" style="background:var(--s-13)"></span><span data-i18n="lg_s13"></span></span>
    <span data-i18n="lg_click"></span>
  </div>
  <div class="plotwrap"><canvas id="ov" height="110"></canvas><div class="tip" id="ovTip"></div></div>
</section>

<section>
  <h2 data-i18n="tr_title"></h2>
  <button id="play"></button>
  <div class="row" style="margin-top:14px">
    <label>BPM</label>
    <input type="range" id="bpmSl" min="40" max="240" step="1" value="120">
    <input type="number" id="bpm" min="20" max="300" step="0.1" value="120" style="width:78px">
  </div>
  <div class="row">
    <label data-i18n="tr_steps"></label>
    <div class="seggrp">
      <button class="seg" data-steps="12">12</button>
      <button class="seg on" data-steps="16">16</button>
      <button class="seg" data-steps="32">32</button>
    </div>
  </div>
  <div class="kv"><span data-i18n="tr_tick"></span><span id="tickms"></span></div>
  <div class="kv"><span data-i18n="tr_step"></span><span id="stepms"></span></div>
  <div class="kv"><span data-i18n="tr_meas"></span><span id="measms"></span></div>
  <div class="row" style="margin-top:12px">
    <label data-i18n="tr_port"></label>
    <select id="port" style="flex:1"></select>
  </div>
  <div class="row"><span id="midistat"></span></div>
  <div class="row">
    <button id="sendClock" class="seg on">F8 / FA / FC</button>
    <button id="mon" class="seg" data-i18n="tr_monitor"></button>
    <button id="panic" data-i18n="tr_panic"></button>
  </div>
  <p class="hint" data-i18n-html="tr_hint"></p>
</section>

<section>
  <h2><span data-i18n="hd_title"></span> <span class="h2r" id="sState"></span></h2>
  <div class="big" id="hDate">&ndash;</div>
  <div class="kv" style="margin-top:6px"><span data-i18n="hd_window"></span><span id="hWin"></span></div>
  <div class="kv"><span data-i18n="hd_day"></span><span id="hIdx"></span></div>
  <div class="row" style="margin-top:10px;align-items:baseline">
    <span class="huge" id="hVal">&ndash;</span>
    <span style="color:var(--dim);font-size:12px" data-i18n="spots"></span>
  </div>
  <div class="tags" id="hTags"></div>
  <div class="kv"><span data-i18n="hd_2713"></span><span id="h2713"></span></div>
  <div class="row" style="margin-top:12px">
    <label data-i18n="hd_loop"></label>
    <select id="rLoop" style="flex:1"></select>
  </div>
  <div class="row">
    <label data-i18n="hd_slide"></label>
    <select id="rSlide" style="flex:1"></select>
  </div>
  <div class="kv"><span data-i18n="hd_speed"></span><span id="dayMs"></span></div>
  <div class="kv"><span data-i18n="hd_cycdur"></span><span id="cycDur"></span></div>
  <div class="stepbtns" style="margin-top:12px">
    <button id="bk27" title="Shift + ←">&minus;27</button>
    <button id="bk1" title="←">&minus;1</button>
    <button id="fw1" title="→">+1</button>
    <button id="fw27" title="Shift + →">+27</button>
  </div>
  <div class="row">
    <button id="follow" class="seg on" style="flex:1" title="F"></button>
    <label style="min-width:auto" data-i18n="hd_goto"></label>
    <input type="date" id="goDate">
  </div>
  <p class="hint" data-i18n-html="hd_hint"></p>
</section>

<section>
  <h2><span data-i18n="cy_title"></span> <span class="h2r" id="cycTitle"></span></h2>
  <div class="cycgrid" id="cycGrid"></div>
  <div class="row" style="margin-top:12px">
    <button id="loop" class="seg" style="flex:1" title="B"></button>
    <button id="span" class="seg on" style="flex:1" title="R"></button>
  </div>
  <div class="row" style="margin-top:0"><button id="home" style="flex:1" title="Home" data-i18n="cy_home"></button></div>
  <div class="tags" id="cycTags"></div>
  <div class="kv"><span data-i18n="cy_min"></span><span id="cStart"></span></div>
  <div class="kv"><span data-i18n="cy_end"></span><span id="cEnd"></span></div>
  <div class="kv"><span data-i18n="cy_max"></span><span id="cMax"></span></div>
  <div class="kv"><span data-i18n="cy_pos"></span><span id="cPos"></span></div>
  <div class="posbar"><i id="cBar"></i></div>
  <p class="hint" data-i18n-html="cy_hint"></p>
</section>



<section>
  <h2 data-i18n="mel_title"></h2>
  <div class="row"><label data-i18n="mel_scale"></label><input type="text" id="scale" value="0 3 5 7 10 12"></div>
  <div class="row" style="margin:-4px 0 4px"><label></label><span id="scaleNames" class="degs"></span></div>
  <div class="row">
    <label data-i18n="mel_root"></label>
    <input type="range" id="rootSl" min="0" max="96" step="1" value="55">
    <span class="val" id="rootVal"></span>
  </div>
  <div class="row">
    <label data-i18n="mel_walk"></label>
    <input type="number" id="wmin" min="1" max="64" value="1" style="width:60px">
    <span class="val" id="wminName"></span>
    <input type="number" id="wmax" min="1" max="64" value="6" style="width:60px">
    <span class="val" id="wmaxName"></span>

<script>
/* =========================================================================
   THE 25th CYCLE · SOLAR-v034 · solar_rhythm_v001.html
   Le rythme est fabrique a partir des donnees SILSO : une mesure = une fenetre
   de jours consecutifs, chaque voix frappe sur les jours qui passent son test.

   Un seul ordonnanceur (Clock) bat le tick 24 ppqn : MIDI clock, pas,
   rythme solaire, melodie, modulation 14 bits et forme en derivent.

   Modules :
     CFG      reglages
     I18N     textes FR / EN
     Midi     Web MIDI (note, CC, CC 14 bits)
     Mon      moniteur audio local
     Clock    ordonnanceur a anticipation, 24 ppqn
     Data     donnees SILSO (paquet integre, CSV depose)
     Series   brut, 27 j, 13 mois, ecart
     Cycles   cycles officiels SILSO, statistiques
     Silso    tete = premier jour de la fenetre ; boucles
     Rhythm   fenetre de jours -> motifs des voix -> triggers et frappes de la Strega
     Mod      sorties de timbre en CC 14 bits
     Forme    5 etats sur un cycle (rythme -> nappe)
     Strega   la Strega : drone, frappes, timbres par phase
     Plot     vues d'ensemble et du cycle
     UI       affichage et commandes

   (c) 2026 Florent Di Bartolo, Universite Gustave Eiffel, LISAA,
   ORCID https://orcid.org/0000-0002-4910-6936.
   Licence CC BY-NC-SA 4.0 : https://creativecommons.org/licenses/by-nc-sa/4.0/
   (usage non commercial, citation obligatoire, partage dans les memes conditions).

   Donnees : WDC-SILSO, Royal Observatory of Belgium, Brussels,
   DOI https://doi.org/10.24414/qnza-ac80 (licence CC BY-NC 4.0).
   ========================================================================= */

'use strict';

/* ---------------------------------------------------------------- config */
const CFG = {
  version: 'SOLAR-v034',
  bpm: 120,
  stepsPerMeasure: 16,      // une mesure = 16 pas = 16 jours de la fenetre
  sendClock: true,          // MIDI clock F8 / FA / FC : les horloges du FH-2 en dependent
  monitor: false,

  // ---- rythme solaire
  rhythm: {
    loop: 2,                // mesures : la fenetre est rejouee 2 fois...
    slide: 8,               // ...puis glisse de 8 jours (en moyenne 1 jour par temps)
    follow: true,           // la fenetre avance avec le transport
    gateCh: 3,              // canal des gates (convention : note = numero de sortie)
    // tests (jour d, m = maximum du lisse 13 mois du cycle de d) :
    //   peak  : pic local (d >= d-1 et d > d+1) au-dessus de la moyenne 27 j, de plus de seuil x m
    //   rise  : montee d'un jour au suivant superieure a seuil x m
    //   level : nombre de taches superieur a seuil x m
    //   burst : ecart au-dessus de la moyenne 27 j superieur a seuil x m
    phrase: 8,              // mesures : le motif est recalcule toutes les 8 mesures
    morph: 2,               // frappes ajoutees ou retirees au plus par voix et par phrase
    swing: 0,               // retard des doubles-croches paires, en fraction de pas (0 a 0,3)
    fill: true,             // caisse claire en fill sur la mesure qui precede un changement d'etat de forme
    // chaque voix boucle sur `len` pas ; positions 0-based par niveau (structure, renfort,
    // syncope) ; plafonds de frappes par etat : bloc Strega (CFG.strega.lignes, max)
    voices: [
      // Crater : le drone (notes tenues dans la reverbe) joue dans toutes les phases ;
      // ses coups secs s'y ajoutent aux etats 4 et 5
      { id: 'kick',   out: 1,  name: 'Crater', input: 'TRIG', test: 'peak',  th: 0,    anchor: true,  gate: 20, on: true,
        loop: { len: 16, tiers: [[0], [6, 10], [13, 3, 8]], min: 1, pRef: 0.3, t3: 5 } },
      // Kraken : pRef 0,12, le test « montee » passe rarement (6 a 13 % des jours aux etats 3-4)
      { id: 'snare',  out: 2,  name: 'Kraken', input: 'HEAD', test: 'rise',  th: 0.10, anchor: false, gate: 20, on: true,
        loop: { len: 12, tiers: [[4], [9], [7, 11, 2]], min: 0, pRef: 0.12, t3: 5, fill: true,
                // sur 16 pas (caisse claire sur 13) avant l'etat `from`
                from: 5, alt: { len: 16, tiers: [[12], [4], [7, 10, 15]],
                                // une note fantome (pas 16 ou 8) des l'etat 3, avant les syncopes
                                ghost: { from: 3, pos: [15, 7], max: 1 } } } },
      // Strega : ses frappes gonflent l'activation (sortie 26), pas de trigger
      { id: 'strega', out: 26, name: 'Strega', input: 'Activation', test: 'burst', th: 0.30, anchor: false, gate: 0, on: true,
        loop: { len: 18, tiers: [[0, 9], [5, 14], [3, 7, 11, 16, 1]], min: 1, pRef: 0.15, t3: 3 } }
    ]
  },

  // ---- ligne melodique : marche aleatoire -> convertisseur MIDI/CV ch 7 -> Crater 1V/oct
  melDiv: 4,
  melState: true,           // la melodie change de note selon l'etat de la forme :
  melBars: [4, 4, 2, 1, 0.5],   // mesures entre deux notes, etats 1 a 5
  melSrc: 'data',           // 'data' : la note suit la moyenne 27 j normalisee dans le cycle ; 'walk' : marche aleatoire
  // drone : le Crater n'est pas entendu sec (vol 20 a 0 aux etats 1-3) ; il excite la reverbe
  // (envoi pre-fader par aux ins 4) sur la note de la melodie. Chaque excitation est une note
  // tenue (le Crater tient au niveau SUSTAIN tant que son TRIGGER est haut). Duree de la note
  // et intervalle jusqu'a la suivante sont tires du jour excitant :
  //   jour avec taches : activite x = fraction du maximum du lisse 13 mois, saturee a `full` ;
  //     note de `gateSpot` (x = 0) a `gateMin` ms (x = 1), intervalle de `spotGap` a `min` pas
  //   jour sans tache : y = longueur de la serie de jours sans tache qui finit ce jour-la,
  //     en echelle log, saturee a `runMax` jours ; note de `gateCalm` a `gateMax` ms,
  //     intervalle de `calmGap` a `max` pas
  // Intervalles arrondis a `quant` pas (4 = un temps). Le drone joue dans toutes les phases.
  drone: { on: true, min: 16, spotGap: 32, calmGap: 36, max: 64, quant: 4, full: 0.3,
           gateMin: 50, gateSpot: 600, gateCalm: 800, gateMax: 4000, runMax: 30 },
  scale: [0, 3, 5, 7, 10, 12],
  root: 55,
  walkMin: 1,
  walkMax: 6,
  walkSpan: 2,
  mel: { ch: 7, vel: 100, gate: 200 },
  out: { range: '0-5', winLo: 55, winHi: 67 },

  // ---- banc de test des sorties d'expander 9 a 24
  bench: { gateCh: 3, ccCh: 4 },
  nappe: { buildMeas: 1, downMeas: 4, upMeas: 1, regenCap: 90 },

  // ---- SILSO
  silso: {
    loop: false,            // boucler sur le cycle courant (prioritaire sur span)
    span: { on: true, from: 7, to: 24 },
    startCycle: 7,
    win27: 27,
    win13: 13,
    storageKey: 'the25thcycle.silso.pack',   // partage avec les autres pages du projet
    expect: {
      n: 76244, first: '1818-01-01', last: '2026-09-30',
      missing: 3247, lastMissing: '1848-12-22',
      provisional: 183, firstProvisional: '2026-04-01',
      max: 528, maxDate: '1870-08-26'
    },
    // Table officielle SILSO (sidc.be/SILSO/cyclesminmax, consultee le 2026-10-07)
    cycles: [
      { n:  6, min: [1810,  7], minSN:  0.0, max: [1816,  5], maxSN:  81.2 },
      { n:  7, min: [1823,  5], minSN:  0.1, max: [1829, 11], maxSN: 119.2 },
      { n:  8, min: [1833, 11], minSN: 12.2, max: [1837,  3], maxSN: 244.9 },
      { n:  9, min: [1843,  7], minSN: 17.6, max: [1848,  2], maxSN: 219.9 },
      { n: 10, min: [1855, 12], minSN:  6.0, max: [1860,  2], maxSN: 186.2 },
      { n: 11, min: [1867,  3], minSN:  9.9, max: [1870,  8], maxSN: 234.0 },
      { n: 12, min: [1878, 12], minSN:  3.7, max: [1883, 12], maxSN: 124.4 },
      { n: 13, min: [1890,  3], minSN:  8.3, max: [1894,  1], maxSN: 146.5 },
      { n: 14, min: [1902,  1], minSN:  4.5, max: [1906,  2], maxSN: 107.1 },
      { n: 15, min: [1913,  7], minSN:  2.5, max: [1917,  8], maxSN: 175.7 },
      { n: 16, min: [1923,  8], minSN:  9.3, max: [1928,  4], maxSN: 130.2 },
      { n: 17, min: [1933,  9], minSN:  5.8, max: [1937,  4], maxSN: 198.6 },
      { n: 18, min: [1944,  2], minSN: 12.9, max: [1947,  5], maxSN: 218.7 },
      { n: 19, min: [1954,  4], minSN:  5.1, max: [1958,  3], maxSN: 285.0 },
      { n: 20, min: [1964, 10], minSN: 14.3, max: [1968, 11], maxSN: 156.6 },
      { n: 21, min: [1976,  3], minSN: 17.8, max: [1979, 12], maxSN: 232.9 },
      { n: 22, min: [1986,  9], minSN: 13.5, max: [1989, 11], maxSN: 212.5 },
      { n: 23, min: [1996,  8], minSN: 11.2, max: [2001, 11], maxSN: 180.3 },
      { n: 24, min: [2008, 12], minSN:  2.2, max: [2014,  4], maxSN: 116.4 },
      { n: 25, min: [2019, 12], minSN:  1.8, max: [2024, 10], maxSN: 160.9 }
    ]
  },

  // ---- 3 sorties de timbre, CC 14 bits sur le canal du banc ; lo / hi en echelle CC 0-127
  mod: [
    { n: 14, cc: 14, name: 'Kraken SNARES',   src: 's27', lo: 0,  hi: 127, inv: false, on: true },
    { n: 21, cc: 25, name: 'Desmodus TONE',   src: 'dev', lo: 24, hi: 104, inv: false, on: true },
    // SHELL du Kraken (sortie FH-2 · 3, Mapping 15 : CC 3 canal 4) : envoye a chaque frappe de
    // caisse claire, juste avant le trigger. Centre = valeur de la phase (bloc Strega) ; ecart par
    // frappe = jitter x ecart du jour au 27 j (fraction du max du lisse 13 mois, x 4, borne a +/-1)
    { n: 3,  cc: 3,  name: 'Kraken SHELL',    src: 's27', lo: 20, hi: 90,  inv: false, on: true, perHit: 'snare', jitter: 0.08 }
  ],
  interp: true,             // rampe des sorties de timbre entre deux fenetres

  // ---- Strega (Make Noise) et percussion par phase. Un drone dans toutes les phases (le
  // Crater excite la reverbe en notes tenues, la matiere de la Strega s'y ajoute a partir de
  // la phase 2) et une percussion qui change par phase, en nombre et en timbre :
  //   1 Kraken seul, repete par la Strega (copie du Kraken par le QPAS dans son entree externe)
  //   2 premieres frappes de la Strega (gonflements tonals), rares
  //   3 frappes de la Strega plus nombreuses + Kraken
  //   4 le Crater sec revient en coups mats
  //   5 toutes les voix, timbres brillants et courts
  // Sorties du troisieme FHX-8CV, CC 14 bits sur le canal du banc :
  //   26 Activation CV, 27 Decay CV, 28 Filter CV, 29 Tones CV (0-5 V). Hauteur : FH-2 · 7 par multiple.
  strega: {
    act:    { n: 26, cc: 26, eps: 0 },
    decay:  { n: 27, cc: 27, eps: 24 },
    filter: { n: 28, cc: 28, eps: 24 },
    tones:  { n: 29, cc: 29, eps: 24 },
    follow: 0.4,            // part de la moyenne 27 j dans la matiere de fond
    filterSpan: 24,         // ecart du filtre (CC) autour de la valeur de l'etat, selon la moyenne 27 j
    swellMs: [1200, 220],   // retombee d'une frappe : jour faible -> longue, jour charge -> courte
    smooth: 2,              // mesures : lissage entre deux etats
    storageKey: 'the25thcycle.strega.solo',   // reglages memorises dans le navigateur
    // etats 1 a 5 ; valeurs en echelle CC 0-127, sauf les plafonds de frappes
    lignes: [
      // Strega
      { key: 's_act',    v: [  0,  34,  44,  54,  60] },   // matiere de fond (Activation), a partir de la phase 2
      { key: 's_swell',  v: [  0,  80,  72,  64,  56] },   // hauteur d'une frappe de la Strega
      { key: 's_decay',  v: [ 96,  92,  80,  66,  52] },   // Decay : repetitions longues au minimum
      { key: 's_filter', v: [ 40,  52,  66,  82,  96] },   // Filter : s'ouvre avec le soleil
      { key: 's_tones',  out: 29, v: [16, 40, 64, 88, 112] },   // Tones : une couleur par phase
      // percussion : plafonds de frappes par boucle
      { key: 's_hits',   voice: 'strega', max: true, v: [0, 2, 4, 5, 7] },  // frappes de la Strega, des la phase 2
      { key: 's_kick',   voice: 'kick',  max: true, v: [0, 0, 0, 3, 3] },   // Crater sec (le drone joue partout)

/* ------------------------------------------------------------------ MIDI */
const Midi = {
  access: null, out: null,

  async init() {
    if (!navigator.requestMIDIAccess) { UI.midiStatus(t('midi_none_api'), 'err'); return; }
    try {
      this.access = await navigator.requestMIDIAccess({ sysex: false });
      this.access.onstatechange = () => this.refresh();
      this.refresh();
    } catch (e) {
      UI.midiStatus(t('midi_denied') + e.message, 'err');
    }
  },
  outputs() { return this.access ? Array.from(this.access.outputs.values()) : []; },
  refresh() {
    const list = this.outputs();
    UI.fillPorts(list, this.out ? this.out.id : null);
    if (!list.length) { this.out = null; UI.midiStatus(t('midi_no_port'), 'err'); return; }
    if (!this.out || !list.some(o => o.id === this.out.id))
      this.select((list.find(o => /fh.?2/i.test(o.name)) || list[0]).id);   // le FH-2 de preference
    else UI.midiStatus(t('midi_connected') + this.out.name, 'ok');
  },
  select(id) {
    this.out = this.outputs().find(o => o.id === id) || null;
    UI.midiStatus(this.out ? t('midi_connected') + this.out.name : t('midi_port_missing'), this.out ? 'ok' : 'err');
    UI.fillPorts(this.outputs(), id);
  },
  send(bytes, t) { if (this.out) { try { this.out.send(bytes, t); } catch (e) {} } },
  realtime(byte, t) { if (CFG.sendClock) this.send([byte], t); },
  note(ch, note, vel, t, gateMs) {
    const c = (ch - 1) & 0x0f;
    this.send([0x90 | c, note & 0x7f, vel & 0x7f], t);
    this.send([0x80 | c, note & 0x7f, 0], t + gateMs);
  },
  holdOn(ch, note, t) { this.send([0x90 | ((ch - 1) & 0x0f), note & 0x7f, 100], t === undefined ? performance.now() : t); },
  holdOff(ch, note, t) { this.send([0x80 | ((ch - 1) & 0x0f), note & 0x7f, 0], t === undefined ? performance.now() : t); },
  cc(num, ch, val, t) { this.send([0xb0 | ((ch - 1) & 0x0f), num & 0x7f, val & 0x7f], t === undefined ? performance.now() : t); },
  // CC 14 bits (manuel FH-2 1.23) : 7 bits faibles sur CC n+32 EN PREMIER, puis 7 bits forts sur CC n
  cc14(num, ch, v14, t) {
    const c = 0xb0 | ((ch - 1) & 0x0f), when = (t === undefined) ? performance.now() : t;
    this.send([c, (num + 32) & 0x7f, v14 & 0x7f], when);
    this.send([c, num & 0x7f, (v14 >> 7) & 0x7f], when);
  },
  panic() {
    const now = performance.now();
    for (let ch = 0; ch < 16; ch++) { this.send([0xb0 | ch, 123, 0], now); this.send([0xb0 | ch, 120, 0], now); }
  }
};

/* -------------------------------------------------- moniteur audio local */
const Mon = {
  ctx: null,
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  at(tMs) { return this.ctx.currentTime + (tMs - performance.now()) / 1000; },
  blip(tMs, freq, dur, gain, type) {
    if (!CFG.monitor) return;
    const ctx = this.ensure(), t = Math.max(this.at(tMs), ctx.currentTime);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  // une couleur par voix, pour ecouter le rythme sans le rack
  voice(tMs, id) {
    const V = { kick: [70, 0.18, 0.5, 'sine'], snare: [220, 0.09, 0.2, 'triangle'],
                strega: [880, 0.4, 0.15, 'triangle'] }[id];
    if (V) this.blip(tMs, V[0], V[1], V[2], V[3]);
  },
  tone(tMs, midiNote, durMs) {
    if (!CFG.monitor) return;
    const ctx = this.ensure(), t = Math.max(this.at(tMs), ctx.currentTime);
    const f = 440 * Math.pow(2, (midiNote + 24 - 69) / 12);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durMs / 1000);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + durMs / 1000 + 0.05);
  }
};

/* ---------------------------------------------------------------- horloge */
const Clock = {
  running: false,
  tick: 0,          // 0..5
  step: 0,          // 0..N-1
  walk: 5,
  nextTickTime: 0,
  timer: null,
  queue: [],        // evenements a afficher, dates en ms

  tickDur() { return 2500 / CFG.bpm; },           // 60000 / bpm / 24

  start() {
    if (this.running) return;
    this.tick = 0; this.step = 0;
    this.queue.length = 0;
    if (CFG.monitor) Mon.ensure();
    Rhythm.onStart(); Forme.onStart(); Strega.onStart();
    const t0 = performance.now() + 30;
    Midi.realtime(0xfa, t0);                       // start
    this.nextTickTime = t0;
    this.running = true;
    this.timer = setInterval(() => this.scheduler(), LOOKAHEAD_MS);
    this.scheduler();
    UI.transport(true);
  },

  stop() {
    if (!this.running) return;
    this.running = false;
    clearInterval(this.timer); this.timer = null;
    Midi.realtime(0xfc, performance.now());        // stop
    Midi.panic();
    this.queue.length = 0;
    Rhythm.onStop();
    Forme.onStop();
    Strega.onStop();
    UI.transport(false);
  },

  toggle() { this.running ? this.stop() : this.start(); },

  scheduler() {
    const horizon = performance.now() + SCHEDULE_AHEAD_MS;
    let guard = 0;
    while (this.running && this.nextTickTime < horizon && guard++ < 512) {
      this.scheduleTick(this.nextTickTime);
      this.nextTickTime += this.tickDur();
    }
  },

  scheduleTick(t) {
    Midi.realtime(0xf8, t);                        // tick, envoye en premier
    this.queue.push({ t, kind: 'tick', tick: this.tick });
    if (this.tick === 0) this.scheduleStep(t);
    Rhythm.onTick(t);                              // rampe des timbres
    Forme.onTick(t);                               // rampes de la forme
    Strega.onTick(t);                              // lecture Strega : activation, decay, filtre
    this.tick = (this.tick + 1) % TICKS_PER_STEP;
  },

  scheduleStep(t) {
    const s = this.step;
    if (s === 0) { Rhythm.onMeasure(t); Forme.onMeasure(t); }   // fenetre et forme d'abord
    // la note d'abord : le Crater frappe deja sur la nouvelle hauteur
    let note = null;
    const md = this.melSteps();
    if (md > 0 && (Rhythm.bar0 + s) % md === 0) {
      note = this.nextNote();
      Midi.note(CFG.mel.ch, note, CFG.mel.vel, t, CFG.mel.gate);
      Mon.tone(t, note, CFG.mel.gate);
    }
    Rhythm.onStep(t, s);                           // triggers et frappes de la Strega
    this.queue.push({ t, kind: 'step', step: s, note });
    this.step = (this.step + 1) % CFG.stepsPerMeasure;
  },

  // pas entre deux notes de la melodie : selon l'etat de la forme, ou la division fixe
  melSteps() {
    if (!CFG.melState) return CFG.melDiv;
    const k = Forme.cur || 1;
    return Math.max(1, Math.round(CFG.melBars[k - 1] * CFG.stepsPerMeasure));
  },

  // marche aleatoire bornee sur la gamme (index 1-based, comme [zl nth])
  nextNote() {
    const sc = CFG.scale;
    if (CFG.melSrc === 'data' && Silso.ready) {
      // la note suit l'activite : moyenne 27 j normalisee dans le cycle -> degre de la gamme
      const x = Cycles.norm('s27', Silso.i, Cycles.of(Silso.i));
      if (!isNaN(x)) {
        const v = Math.round(CFG.walkMin + clamp01(x) * (CFG.walkMax - CFG.walkMin));
        this.walk = v;
        const deg = sc.length ? sc[Math.min(sc.length, Math.max(1, v)) - 1] : 0;
        return Math.min(127, Math.max(0, deg + CFG.root));
      }
    }
    const span = CFG.walkSpan;
    const delta = Math.floor(Math.random() * (2 * span + 1)) - span;
    const v = Math.min(CFG.walkMax, Math.max(CFG.walkMin, this.walk + delta));
    this.walk = v;
    const deg = sc.length ? sc[Math.min(sc.length, Math.max(1, v)) - 1] : 0;
    return Math.min(127, Math.max(0, deg + CFG.root));
  }
};

const I18N = {
  lang: 'fr',
  storageKey: 'the25thcycle.lang',

  init() {
    let l = null;
    try { l = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (!l) { try { l = localStorage.getItem(this.storageKey); } catch (e) {} }
    if (!l) l = (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
    this.lang = (l === 'en') ? 'en' : 'fr';
    this.apply();
  },

  set(l) {
    this.lang = (l === 'en') ? 'en' : 'fr';
    try { localStorage.setItem(this.storageKey, this.lang); } catch (e) {}
    this.apply();
    UI.relabel(); SUI.relabel(); FUI.relabel(); FUI.show(); if (typeof SGUI !== 'undefined') SGUI.table();
    Plot.ovCache = null; Plot.cvCache = null;
    if (Silso.ready) Plot.draw(SUI.cur);
  },

  // textes statiques : data-i18n (texte), data-i18n-html (balises permises)
  apply() {
    document.documentElement.lang = this.lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === this.lang));
  }
};

function t(key, p) {
  const D = TEXTS[I18N.lang] || TEXTS.fr;
  let s = (key in D) ? D[key] : (key in TEXTS.fr ? TEXTS.fr[key] : key);
  if (typeof s === 'string' && p) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in p ? p[k] : m));
  return s;
}

    f_hint: 'L’état vient du <b>lissé 13 mois</b> normalisé dans le cycle, découpé en 5 tranches égales (seuils 0,2 · 0,4 · 0,6 · 0,8, sans marge). Il ne change qu’aux mesures multiples de la grille, comptées depuis <code>START</code>, puis glisse en rampe vers les valeurs de l’état (8 mesures entre les états 1 et 2, 4 sinon). <b>La réverbe porte le drone dans toutes les phases</b> : longue à l’état 1 (<code>Regen</code> 75), un peu plus courte quand le soleil monte (55 à l’état 5). Le Crater la nourrit partout (envoi 102 à 85) ; son <code>vol</code> sec reste à 0 aux états 1 à 3 : chaque excitation est une <b>note tenue</b> à intervalle irrégulier tiré des jours, plus longue (jusqu’à 4 s) après une longue série de jours sans tache, plus courte (de 600 à 50 ms) les jours avec taches ; le Crater tient au niveau de son potard <code>SUSTAIN</code> tant que le gate est haut. La Strega et le Kraken y sont peu envoyés, pour que les frappes restent lisibles, sauf par les <b>dub throws</b> (états 2 à 5) : l’envoi s’ouvre un pas sur la dernière caisse claire de chaque phrase, sur tout le fill, et sur les frappes de la Strega des mesures 4 et 8. <code>Size</code> respire aux états 1 à 3 (±12, ±6, ±4). La <b>nappe figée</b> (case <code>FSU</code> de l’état 1, décochée par défaut) n’existe qu’au <b>creux du minimum</b> (repère bleu) : le <code>FSU</code> part à la fin de la transition qui y mène, quand la cuve est pleine, et relâche au début de la suivante. Boutons 1-5, gate 8CV n°2 · 1 (17), curseur d’une de ces sorties ou <b>Valeurs par défaut</b> : la forme passe en manuel (le <code>FSU</code> suit alors la case du tableau). <b>STOP coupe la réverbe</b> (bouton) : <code>Regen</code> et envois à 0, <code>FSU</code> relâché, la queue s’éteint ; START rend les valeurs de l’état.',
