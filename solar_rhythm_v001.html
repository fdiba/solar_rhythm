/* ------------------------------------------------------------------ data */
// Paquet compact (integre en fin de page, ou memorise apres un depot) :
//   ligne 1  SILSO-PACK 1;start=AAAA-MM-JJ;n=N;name=fichier
//   ligne 2  indicateur definitif en plages : 1x76061,0x183
//   ligne 3  valeurs separees par des virgules, vide = manquant (-1)
const Data = {
  t0: 0, n: 0,
  raw: null,        // Int16Array, -1 = manquant
  def: null,        // Uint8Array, 1 = definitif, 0 = provisoire
  name: '', origin: '',

  set(d, origin) {
    this.t0 = Date.UTC(d.start[0], d.start[1] - 1, d.start[2]);
    this.n = d.raw.length; this.raw = d.raw; this.def = d.def;
    this.name = d.name; this.origin = origin;
  },

  parsePack(text) {
    const L = text.trim().split('\n');
    if (!/^SILSO-PACK 1;/.test(L[0])) throw new Error(t('err_pack'));
    const h = {};
    L[0].split(';').slice(1).forEach(kv => { const p = kv.indexOf('='); h[kv.slice(0, p)] = kv.slice(p + 1); });
    const n = +h.n, start = h.start.split('-').map(Number);
    const def = new Uint8Array(n);
    let k = 0;
    L[1].split(',').forEach(run => { const [f, c] = run.split('x').map(Number); def.fill(f, k, k + c); k += c; });
    const vals = L[2].split(','), raw = new Int16Array(n);
    if (vals.length !== n || k !== n) throw new Error(t('err_pack2'));
    for (let i = 0; i < n; i++) raw[i] = vals[i] === '' ? -1 : +vals[i];
    return { start, raw, def, name: h.name || '' };
  },

  toPack(d) {
    const runs = [];
    for (let i = 0; i < d.def.length; i++) {
      const r = runs[runs.length - 1];
      if (r && r[0] === d.def[i]) r[1]++; else runs.push([d.def[i], 1]);
    }
    const vals = new Array(d.raw.length);
    for (let i = 0; i < d.raw.length; i++) vals[i] = d.raw[i] < 0 ? '' : d.raw[i];
    return 'SILSO-PACK 1;start=' + d.start.map((x, j) => j ? pad(x) : x).join('-') +
           ';n=' + d.raw.length + ';name=' + d.name + '\n' +
           runs.map(r => r[0] + 'x' + r[1]).join(',') + '\n' + vals.join(',');
  },

  // CSV SILSO (separateur ;, 8 colonnes) ou TXT (espaces, * = provisoire)
  parseCSV(text, name) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) throw new Error(t('err_empty'));
    const raw = new Int16Array(lines.length), def = new Uint8Array(lines.length);
    let start = null, t0 = 0;
    lines.forEach((l, i) => {
      const f = l.includes(';') ? l.split(';').map(s => s.trim()) : l.trim().split(/\s+/);
      const y = +f[0], m = +f[1], d = +f[2], v = parseInt(f[4], 10);
      if (!(y > 1700 && m >= 1 && m <= 12 && d >= 1 && d <= 31) || isNaN(v))
        throw new Error(t('err_line', { n: i + 1, txt: l.slice(0, 40) }));
      const t = Date.UTC(y, m - 1, d);
      if (i === 0) { start = [y, m, d]; t0 = t; }
      else if (Math.round((t - t0) / DAY_MS) !== i)
        throw new Error(t('err_contig', { n: i + 1, date: y + '-' + pad(m) + '-' + pad(d) }));
      raw[i] = v < 0 ? -1 : v;
      def[i] = f.length >= 8 ? (f[7] === '1' ? 1 : 0) : (l.includes('*') ? 0 : 1);
    });
    return { start, raw, def, name };
  },

  ymd(i) { const D = new Date(this.t0 + i * DAY_MS); return [D.getUTCFullYear(), D.getUTCMonth() + 1, D.getUTCDate()]; },
  iso(i) { const [y, m, d] = this.ymd(i); return y + '-' + pad(m) + '-' + pad(d); },
  idx(y, m, d) { return Math.round((Date.UTC(y, m - 1, d) - this.t0) / DAY_MS); },
  // date decimale SILSO : annee + (jour de l'annee - 0,5) / jours de l'annee
  dec(i) {
    const [y] = this.ymd(i), t = this.t0 + i * DAY_MS;
    const a = Date.UTC(y, 0, 1), b = Date.UTC(y + 1, 0, 1);
    return y + ((t - a) / DAY_MS + 0.5) / ((b - a) / DAY_MS);
  },

  // controles demandes : comptes recalcules et compares aux chiffres de reference
  verify() {
    const E = CFG.silso.expect, n = this.n;
    let miss = 0, lastMiss = -1, prov = 0, firstProv = -1, mx = -1, mxI = -1;
    for (let i = 0; i < n; i++) {
      const v = this.raw[i];
      if (v < 0) { miss++; lastMiss = i; }
      else if (v > mx) { mx = v; mxI = i; }
      if (!this.def[i]) { prov++; if (firstProv < 0) firstProv = i; }
    }
    // les provisoires forment-ils un seul bloc final ?
    const provBlock = prov === 0 || (firstProv + prov === n);
    const C = (label, got, exp) => ({ label, got: String(got), exp: String(exp), ok: String(got) === String(exp) });
    return {
      list: [
        C(t('ck_rows'), n, E.n),
        C(t('ck_first'), this.iso(0), E.first),
        C(t('ck_last'), this.iso(n - 1), E.last),
        C(t('ck_missing'), miss, E.missing),
        C(t('ck_lastmiss'), lastMiss < 0 ? '–' : this.iso(lastMiss), E.lastMissing),
        C(t('ck_prov'), prov, E.provisional),
        C(t('ck_firstprov'), firstProv < 0 ? '–' : this.iso(firstProv), E.firstProvisional),
        C(t('ck_max'), mx, E.max),
        C(t('ck_maxdate'), this.iso(mxI), E.maxDate),
        { label: t('ck_block'), got: provBlock ? t('yes') : t('no'), exp: t('yes'), ok: provBlock }
      ],
      firstProv
    };
  }
};

/* ---------------------------------------------------------------- series */
// Chaque serie existe en deux versions :
//   v*  valeurs vraies (NaN = indefini) : servent aux statistiques
//   *   valeurs tenues (derniere valeur definie) : ce que la tete lit
const Series = {
  raw: null, heldFrom: null,         // brut tenu, et indice de la valeur tenue
  vraw: null,
  s27: null, v27: null, f27: null,   // f27 : 0 ok, 1 fenetre tronquee, 2 aucune valeur (tenue)
  s13: null, v13: null, f13: null,   // f13 : 0 ok, 1 fenetre tronquee
  months: [],

  build() {
    const n = Data.n, R = Data.raw;
    this.vraw = new Float32Array(n); this.raw = new Float32Array(n); this.heldFrom = new Int32Array(n);
    let last = NaN, lastI = -1;
    for (let i = 0; i < n; i++) {
      const v = R[i] < 0 ? NaN : R[i];
      this.vraw[i] = v;
      if (!isNaN(v)) { last = v; lastI = i; }
      this.raw[i] = last; this.heldFrom[i] = lastI;
    }
    this.build27(); this.build13(); this.buildDev();
  },

  // moyenne glissante centree sur 27 jours (une rotation solaire), jours valides seulement
  build27() {
    const n = Data.n, h = (CFG.silso.win27 - 1) >> 1;
    const cs = new Float64Array(n + 1), cn = new Int32Array(n + 1);
    for (let i = 0; i < n; i++) {
      const v = this.vraw[i], ok = !isNaN(v);
      cs[i + 1] = cs[i] + (ok ? v : 0); cn[i + 1] = cn[i] + (ok ? 1 : 0);
    }
    this.v27 = new Float32Array(n); this.s27 = new Float32Array(n); this.f27 = new Uint8Array(n);
    let last = NaN;
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - h), b = Math.min(n - 1, i + h);
      const c = cn[b + 1] - cn[a];
      const v = c ? (cs[b + 1] - cs[a]) / c : NaN;
      this.v27[i] = v;
      if (!isNaN(v)) last = v;
      this.s27[i] = last;
      this.f27[i] = !c ? 2 : (i - h < 0 || i + h > n - 1) ? 1 : 0;
    }
  },

  // lissage 13 mois SILSO : moyennes mensuelles, fenetre centree de 13 mois,
  // poids 1/2 aux deux extremites ; puis interpolation lineaire entre milieux de mois
  build13() {
    const n = Data.n, M = [];
    let cur = null;
    for (let i = 0; i < n; i++) {
      const [y, m] = Data.ymd(i), key = y * 12 + m;
      if (!cur || cur.key !== key) { cur = { key, y, m, first: i, last: i, sum: 0, cnt: 0 }; M.push(cur); }
      cur.last = i;
      const v = this.vraw[i];
      if (!isNaN(v)) { cur.sum += v; cur.cnt++; }
    }
    const H = (CFG.silso.win13 - 1) >> 1;
    M.forEach((mo, k) => {
      mo.mean = mo.cnt ? mo.sum / mo.cnt : NaN;
      mo.centre = (mo.first + mo.last) / 2;
    });
    M.forEach((mo, k) => {
      let s = 0, w = 0;
      for (let j = -H; j <= H; j++) {
        const o = M[k + j]; if (!o || isNaN(o.mean)) continue;
        const wj = Math.abs(j) === H ? 0.5 : 1;
        s += wj * o.mean; w += wj;
      }
      mo.smooth = w ? s / w : NaN;
      mo.trunc = (k - H < 0 || k + H > M.length - 1);
    });
    this.months = M;
    this.v13 = new Float32Array(n); this.s13 = new Float32Array(n); this.f13 = new Uint8Array(n);
    let k = 0;
    for (let i = 0; i < n; i++) {
      while (k < M.length - 1 && i > M[k].last) k++;
      const mo = M[k];
      let a, b;
      if (i < mo.centre) { a = M[k - 1] || mo; b = mo; } else { a = mo; b = M[k + 1] || mo; }
      const span = b.centre - a.centre;
      const t = span > 0 ? (i - a.centre) / span : 0;
      const va = isNaN(a.smooth) ? b.smooth : a.smooth, vb = isNaN(b.smooth) ? va : b.smooth;
      const v = va + (vb - va) * clamp01(t);
      this.v13[i] = v; this.s13[i] = v;
      this.f13[i] = (a.trunc || b.trunc) ? 1 : 0;
    }
  },

  // ecart 27 j - 13 mois : activite de la rotation au-dessus (+) ou en dessous (-) de la tendance
  buildDev() {
    const n = Data.n;
    this.vdev = new Float32Array(n); this.dev = new Float32Array(n);
    for (let i = 0; i < n; i++) { this.vdev[i] = this.v27[i] - this.v13[i]; this.dev[i] = this.s27[i] - this.s13[i]; }
  },

  held(key, i) { return key === 'raw' ? this.raw[i] : key === 's27' ? this.s27[i] : key === 's13' ? this.s13[i] : this.dev[i]; },
  vals(key) { return key === 'raw' ? this.vraw : key === 's27' ? this.v27 : key === 's13' ? this.v13 : this.vdev; }
};

/* ---------------------------------------------------------------- cycles */
const Cycles = {
  list: [],

  build() {
    const n = Data.n, C = CFG.silso.cycles;
    this.list = [];
    C.forEach((c, k) => {
      const s0 = Data.idx(c.min[0], c.min[1], 1);               // 1er du mois du minimum
      const nx = C[k + 1];
      const e0 = nx ? Data.idx(nx.min[0], nx.min[1], 1) : n;    // exclu
      const start = Math.max(0, s0), end = Math.min(n, e0);
      if (end <= start) return;                                  // hors des donnees
      this.list.push({
        n: c.n, off: c, start, end, len: end - start,
        partial: s0 < 0,                    // commence avant les donnees (cycle 6)
        ongoing: !nx || e0 > n,             // pas encore de minimum suivant (cycle 25)
        stats: {}
      });
    });
    this.list.forEach(cy => SERIES.forEach(S => cy.stats[S.key] = this.stats(Series.vals(S.key), cy)));
  },

  stats(V, cy) {
    let mn = Infinity, mx = -Infinity, mnI = -1, mxI = -1, s = 0, c = 0;
    for (let i = cy.start; i < cy.end; i++) {
      const v = V[i]; if (isNaN(v)) continue;
      if (v < mn) { mn = v; mnI = i; }
      if (v > mx) { mx = v; mxI = i; }
      s += v; c++;
    }
    return { min: mn, minI: mnI, max: mx, maxI: mxI, mean: c ? s / c : NaN, count: c,
             amax: Math.max(Math.abs(mn), Math.abs(mx)) };
  },

  of(i) {
    const L = this.list;
    for (let k = L.length - 1; k >= 0; k--) if (i >= L[k].start) return L[k];
    return L[0];
  },
  index(cy) { return this.list.indexOf(cy); },
  byN(n) { return this.list.find(c => c.n === n); },

  // 0-1 dans le cycle ; l'ecart est normalise symetriquement (0,5 = sur la tendance)
  norm(key, i, cy) {
    const st = cy.stats[key], v = Series.held(key, i);
    if (key === 'dev') return (isNaN(v) || !(st.amax > 0)) ? NaN : clamp01(0.5 + 0.5 * v / st.amax);
    if (isNaN(v) || !(st.max > st.min)) return NaN;
    return clamp01((v - st.min) / (st.max - st.min));
  }
};



/* ------------------------------------------------------------ tete SILSO */
// La tete est le PREMIER JOUR de la fenetre en cours. Elle n'a pas d'horloge propre :
// Rhythm la fait glisser a la mesure, sur la grille du transport.
const Silso = {
  ready: false,
  i: 0,

  // jour suivant. Priorites :
  //   1. boucle sur le cycle : fin du cycle -> debut du meme cycle
  //   2. boucle 7 -> 24 : fin du cycle 24, ou fin des donnees -> debut du cycle 7
  //   3. sinon -1 (fin des donnees)
  next(i) {
    const S = CFG.silso, cy = Cycles.of(Math.max(0, i));
    const j = i + 1;
    if (S.loop && i >= cy.start && j >= cy.end) return cy.start;
    if (S.span.on) {
      const a = Cycles.byN(S.span.from), b = Cycles.byN(S.span.to);
      if (a && b && (j === b.end || j > Data.n - 1)) return a.start;
    }
    return j > Data.n - 1 ? -1 : j;
  },

  seek(i) {
    if (!this.ready) return;
    i = Math.min(Data.n - 1, Math.max(0, Math.round(i)));
    this.i = i;
    Rhythm.ended = false;
    Rhythm.build(i);
    Rhythm.metric(i, false);
    Rhythm.g = 0;
    for (let k = Clock.queue.length - 1; k >= 0; k--)
      if (['day', 'mod', 'win'].includes(Clock.queue[k].kind)) Clock.queue.splice(k, 1);
    SUI.show(i);
    if (!Clock.running || !CFG.rhythm.follow) Mod.push(i);   // a l'arret : on entend la position
  },

  step(d) { this.seek(SUI.cur + d); },
  cycle(delta) {
    const L = Cycles.list, k = Cycles.index(Cycles.of(SUI.cur));
    this.seek(L[Math.min(L.length - 1, Math.max(0, k + delta))].start);
  },

  // changements d'etat de la forme : premier jour ou l'etat cible differe de celui du jour i
  // (vers l'avant), ou debut du segment d'etat en cours / du precedent (vers l'arriere)
  nextChange(i) {
    const k = Forme.target(i);
    for (let d = i + 1; d < Data.n; d++) { const x = Forme.target(d); if (x !== null && x !== k) return d; }
    return -1;
  },
  prevChange(i) {
    const seg = j => { const k = Forme.target(j); while (j > 0 && Forme.target(j - 1) === k) j--; return j; };
    let j = seg(i);
    if (j === i && i > 0) j = seg(i - 1);        // deja au debut : segment precedent
    return j;
  },
  phase(dir) {
    const j = dir > 0 ? this.nextChange(SUI.cur) : this.prevChange(SUI.cur);
    if (j >= 0) this.seek(j);
  }
};

/* ---------------------------------------------------------- rythme solaire */
// La tete avance sur la grille du transport : la fenetre de N jours est rejouee
// CFG.rhythm.loop fois, puis glisse de CFG.rhythm.slide jours.
// Toutes les CFG.rhythm.phrase mesures, on lit les jours que la phrase va parcourir.
// Chaque voix boucle sur sa propre longueur (CFG.rhythm.voices[].loop). La part des
// jours qui passent le test d'une voix donne son nombre de frappes, plafonne par etat
// (bloc Strega) ; elles remplissent les positions de sa boucle niveau par niveau
// (structure, renfort, syncope), et a niveau egal les jours les plus forts gagnent.
// Le niveau 3 n'est ouvert qu'a partir de l'etat t3. D'une phrase a l'autre, le motif
// ne change que de CFG.rhythm.morph frappes par voix ; mutations aux mesures 4 et 8.
// Le kick joue en plus le drone (notes tenues dans la reverbe) dans toutes les phases.
const TESTS = ['peak', 'rise', 'level', 'burst'];

const Rhythm = {
  days: [],         // indices des jours de la fenetre (-1 = au-dela des donnees)
  pat: {},          // id de voix -> [bool] par position de sa boucle
  info: {},         // id de voix -> { n, p, open, played, len } : dernier calcul
  order: {},        // id de voix -> ordre complet des positions
  mut: {},          // id de voix -> { from, to } : mutation de la mesure en cours
  bar0: 0,          // pas absolu du debut de la mesure en cours, depuis START
  phrase: null,     // { start, n, days, act } : jours lus par la phrase en cours
  fillOn: false,    // la mesure en cours est un fill
  nextStart: -1,    // premier jour de la fenetre suivante
  meas: 0,          // mesures depuis START
  rep: 0,           // rang de la mesure dans la boucle (0 .. loop-1)
  pm: 0,            // rang de la mesure dans la phrase (0 .. phrase-1)
  g: 0,             // ticks depuis le debut de la fenetre (rampe des timbres)
  ended: false,     // fin des donnees sans boucle : la fenetre est tenue

  // k jours plus loin, en suivant les boucles ; -1 si les donnees s'arretent avant
  advance(i, k) {
    let j = i;
    for (let n = 0; n < k; n++) { const x = Silso.next(j); if (x < 0) return -1; j = x; }
    return j;
  },

  // n jours consecutifs a partir de i, en suivant les boucles (-1 au-dela des donnees)
  span(i, n) {
    const out = [];
    let j = i;
    for (let s = 0; s < n; s++) { out.push(j); if (j >= 0) j = Silso.next(j); }
    return out;
  },

  build(i) {
    this.days = this.span(i, CFG.stepsPerMeasure);
    this.nextStart = this.advance(i, CFG.rhythm.slide);
  },

  rebuild() { if (Silso.ready) { this.build(Silso.i); this.metric(Silso.i, false); } },

  // le test d'une voix sur le jour d (pas s de la mesure)
  test(v, d, s) {
    if (v.anchor && s === 0) return true;               // ancrage : premier temps de la mesure
    if (d < 0) return false;
    const R = Series.vraw, x = R[d];
    if (isNaN(x)) return false;                         // jour manquant : silence
    const m = Cycles.of(d).stats.s13.max;
    if (!(m > 0)) return false;
    const prev = d > 0 ? R[d - 1] : NaN, nxt = d < Data.n - 1 ? R[d + 1] : NaN, a27 = Series.v27[d];
    switch (v.test) {
      case 'peak':  return x >= prev && x > nxt && (x - a27) > v.th * m;
      case 'rise':  return (x - prev) / m > v.th;
      case 'level': return x / m > v.th;
      case 'burst': return (x - a27) / m > v.th;
    }
    return false;
  },

  // force d'un jour pour une voix : la grandeur que mesure son test (fraction du maximum
  // du lisse 13 mois du cycle), +10 si le jour passe le test. -Infinity : jour manquant.
  score(v, d) {
    if (d < 0) return -Infinity;
    const R = Series.vraw, x = R[d];
    if (isNaN(x)) return -Infinity;
    const m = Cycles.of(d).stats.s13.max;
    if (!(m > 0)) return -Infinity;
    const prev = d > 0 ? R[d - 1] : NaN, a27 = Series.v27[d];
    let q;
    switch (v.test) {
      case 'peak':  q = (x - a27) / m; break;
      case 'rise':  q = (x - prev) / m; break;
      case 'level': q = x / m; break;
      case 'burst': q = (x - a27) / m; break;
      default:      q = 0;
    }
    if (isNaN(q)) q = 0;
    return q + (this.test(v, d, 1) ? 10 : 0);           // s = 1 : hors ancrage
  },

  // boucle d'une voix a l'etat act : sa table `alt` (16 pas) avant l'etat `from` ;
  // plafonds par etat lus dans le bloc Strega
  table(v, act) {
    let P = v.loop;
    if (P.alt && (act || 1) < (P.from || 1)) P = Object.assign({}, P, P.alt);
    return Object.assign({}, P, { max: Strega.max(v.id) || P.max || [0, 0, 0, 0, 0] });
  },

  // niveaux de la boucle d'une voix ; une position deja prise par un niveau precedent est ignoree
  tiers(v, act) {
    const seen = new Set();
    const T0 = this.table(v, act === undefined ? (this.phrase ? this.phrase.act : 1) : act), L = T0.len;
    return T0.tiers.map(T => T.filter(s => s < L && !seen.has(s) && seen.add(s)));
  },

  // motif cible d'une voix sur les jours D, a l'etat de cycle act (1-5)
  //   -> { set: [positions], n, p, open, order }
  target(v, D, act) {
    const M = this.table(v, act), TI = this.tiers(v, act), L = M.len;
    const valid = D.filter(d => d >= 0 && !isNaN(Series.vraw[d]));
    const pass = valid.filter(d => this.test(v, d, 1)).length;
    const p = valid.length ? pass / valid.length : 0;
    // force de chaque position : le meilleur des jours qui tombent sur elle dans la phrase
    const pos = new Array(L).fill(-Infinity);
    D.forEach((d, k) => { const sc = this.score(v, d); if (sc > pos[k % L]) pos[k % L] = sc; });
    // ordre complet : niveau par niveau, puis force decroissante (ancrage en tete)
    const order = [];
    TI.forEach(T => {
      T.map((s, r) => ({ s, r, f: pos[s] }))
       .sort((a, b) => (b.f === a.f ? 0 : (b.f > a.f ? 1 : -1)) || (a.r - b.r))
       .forEach(o => order.push(o.s));
    });
    if (v.anchor) { const k = order.indexOf(0); if (k > 0) { order.splice(k, 1); order.unshift(0); } }
    const open = (act || 1) >= M.t3 ? TI.length : Math.min(2, TI.length);
    const OP = this.openPos(M, TI, act);
    const mx = M.max[Math.min(M.max.length, Math.max(1, act || 1)) - 1];
    let n = Math.round(M.min + (mx - M.min) * clamp01(M.pRef > 0 ? p / M.pRef : 0));
    n = mx > 0 ? Math.max(0, Math.min(n, mx, OP.cap)) : 0;     // plafond 0 : la voix se tait a cet etat
    const set = order.filter(s => OP.pos.includes(s)).slice(0, n);
    // note fantome : des qu'un jour de la phrase passe le test, la position fantome la plus forte
    // s'ajoute (en plus du nombre de frappes), dans la limite de M.ghost.max
    const G = M.ghost;
    if (G && mx > 0 && act >= G.from && act < M.t3 && p > 0) {
      const gp = order.filter(s => G.pos.includes(s) && OP.pos.includes(s));
      let have = set.filter(s => G.pos.includes(s)).length;
      for (const s of gp) { if (have >= G.max) break; if (!set.includes(s)) { set.push(s); have++; } }
    }
    return { set, n: set.length, p, open, order };
  },

  // positions ouvertes a l'etat act : niveaux 1-2, plus le niveau 3 a partir de t3 ; avant,
  // les notes fantomes de M.ghost ({ from, pos, max }) : au plus `max` frappes parmi `pos`
  openPos(M, TI, act) {
    act = act || 1;
    if (act >= M.t3) { const pos = TI.flat(); return { pos, cap: pos.length }; }
    const base = TI.slice(0, 2).flat();
    const G = M.ghost;
    if (!G || act < G.from) return { pos: base, cap: base.length };
    const all = TI.flat(), gp = G.pos.filter(s => all.includes(s) && !base.includes(s));
    return { pos: base.concat(gp), cap: base.length + Math.min(G.max, gp.length) };
  },

  // d'un motif a l'autre : au plus `budget` frappes ajoutees ou retirees
  morph(cur, tgt, budget) {
    const C = new Set(cur), T = new Set(tgt.set), order = tgt.order;
    const rank = s => { const k = order.indexOf(s); return k < 0 ? 99 : k; };
    const adds = tgt.set.filter(s => !C.has(s));                                   // les plus importantes d'abord
    const rems = [...C].filter(s => !T.has(s)).sort((a, b) => rank(b) - rank(a));   // les moins importantes d'abord
    let b = budget;
    while (b > 0) {
      if (C.size < T.size && adds.length) { C.add(adds.shift()); b--; }
      else if (C.size > T.size && rems.length) { C.delete(rems.shift()); b--; }
      else if (adds.length && rems.length && b >= 2) { C.delete(rems.shift()); C.add(adds.shift()); b -= 2; }
      else break;
    }
    return [...C].sort((a, b) => a - b);
  },

  // motif a partir du jour i ; morph : transition limitee depuis le motif en cours
  metric(i, morph) {
    const R = CFG.rhythm, L = CFG.stepsPerMeasure;
    const n = Math.max(L, Math.round(R.phrase * this.daysPerMeasure()));
    const D = this.span(i, n);
    const act = Forme.target(i) || 1;
    this.phrase = { start: i, n, days: D, act };
    R.voices.forEach(v => {
      const len = this.table(v, act).len;
      const tg = this.target(v, D, act);
      const prev = this.pat[v.id];
      const curSet = (prev && prev.length === len) ? prev.map((h, s) => h ? s : -1).filter(s => s >= 0) : null;
      const set = (morph && curSet) ? this.morph(curSet, tg, R.morph) : tg.set;
      const arr = new Array(len).fill(false); set.forEach(s => { arr[s] = true; });
      this.pat[v.id] = arr;
      this.info[v.id] = { n: tg.n, p: tg.p, open: tg.open, played: set.length, len };
      this.order[v.id] = tg.order;
    });
    this.mut = {};
    if (!morph) this.planDrone(true);
  },

  // positions jouees en plus pendant un fill (niveau 3 des voix qui ont fill: true)
  fillSet(v) {
    const M = this.table(v, this.phrase ? this.phrase.act : 1);
    if (!M.fill) return [];
    const TI = this.tiers(v);
    return TI.length > 2 ? TI[2] : [];
  },

  // position d'un pas de la mesure dans la boucle d'une voix
  loopPos(v, s) { const P = this.pat[v.id]; return (this.bar0 + s) % (P && P.length ? P.length : v.loop.len); },

  // drone : dans toutes les phases, le kick excite la reverbe en notes tenues a des
  // intervalles irreguliers, tires des jours (voir CFG.drone)
  droneOn() { return !!(CFG.drone && CFG.drone.on); },
  droneNext: 0,     // pas absolu de la prochaine excitation du drone
  droneSet: null,   // pas de la mesure en cours ou le drone frappe -> duree du gate (ms)

  // le jour d pour le drone : { spot, x } ; spot = le jour a des taches ; x = son activite
  // (jour avec taches) ou la longueur de sa serie de jours sans tache (jour calme), 0-1
  droneDay(d) {
    const D = CFG.drone, R = Series.vraw;
    if (!(d >= 0)) return { spot: false, x: 1 };
    const v = R[d];
    if (!isNaN(v) && v > 0) {
      const m = Cycles.of(d).stats.s13.max;
      return { spot: true, x: m > 0 ? clamp01(v / m / (D.full || 1)) : 0 };
    }
    let run = 0;                                         // jours sans tache (ou manquants) jusqu'a d
    for (let j = d; j >= 0 && run < D.runMax && !(R[j] > 0); j--) run++;
    return { spot: false, x: clamp01(Math.log(Math.max(1, run)) / Math.log(Math.max(2, D.runMax))) };
  },

  // intervalle (en pas) apres une excitation tombee sur le jour d
  droneGap(d) {
    const D = CFG.drone, q = Math.max(1, D.quant || 1), j = this.droneDay(d);
    const g = j.spot ? D.spotGap - (D.spotGap - D.min) * j.x : D.calmGap + (D.max - D.calmGap) * j.x;
    return Math.max(q, Math.round(g / q) * q);
  },

  // duree du gate (ms) d'une excitation tombee sur le jour d
  droneGate(d) {
    const D = CFG.drone, j = this.droneDay(d);
    return Math.round(j.spot ? D.gateSpot - (D.gateSpot - D.gateMin) * j.x : D.gateCalm + (D.gateMax - D.gateCalm) * j.x);
  },

  // excitations de la mesure en cours ; fresh : on repart du premier pas de la mesure
  planDrone(fresh) {
    const L = CFG.stepsPerMeasure, set = new Map();
    if (fresh || this.droneNext < this.bar0) this.droneNext = this.bar0;
    let guard = 0;
    while (this.droneNext < this.bar0 + L && guard++ < 64) {
      const s = this.droneNext - this.bar0, d = this.days[s % this.days.length], gap = this.droneGap(d);
      // le gate ne deborde jamais sur l'excitation suivante (90 % de l'intervalle au plus)
      set.set(s, Math.min(this.droneGate(d), Math.round(0.9 * gap * TICKS_PER_STEP * Clock.tickDur())));
      this.droneNext += gap;
    }
    this.droneSet = set;
  },

  // mutation (mesures 4 et 8 de la phrase) : la frappe la moins importante part vers la
  // position libre que les jours de la mesure designent
  mutate() {
    this.mut = {};
    const L = CFG.stepsPerMeasure, act = this.phrase ? this.phrase.act : 1;
    CFG.rhythm.voices.forEach(v => {
      const P = this.pat[v.id], order = this.order[v.id];
      if (!P || !order) return;
      const hits = order.filter(s => P[s]);
      if (hits.length < 2) return;
      const from = hits[hits.length - 1];
      const TI = this.tiers(v, act), open = this.openPos(this.table(v, act), TI, act).pos;
      const sc = new Map();
      this.days.forEach((d, k) => { if (k >= L) return; const p = this.loopPos(v, k); const x = this.score(v, d); if (!sc.has(p) || x > sc.get(p)) sc.set(p, x); });
      let to = -1, best = -Infinity;
      open.forEach(p => { if (P[p] || !sc.has(p)) return; const x = sc.get(p); if (x > best) { best = x; to = p; } });
      if (to >= 0 && best > -Infinity) this.mut[v.id] = { from, to };
    });
  },

  // la mesure en cours, vue d'une voix : [{ on, fill, mut, drone }] par pas (affichage)
  barHits(v) {
    const L = CFG.stepsPerMeasure, out = [];
    for (let s = 0; s < L; s++) {
      const on = this.plays(v, s, true), f = this.plays(v, s);
      const mu = !!this.mut[v.id] && this.loopPos(v, s) === this.mut[v.id].to;
      const dr = v.id === 'kick' && this.droneOn() && !!this.droneSet && this.droneSet.has(s);
      out.push({ on, fill: f && !on, mut: mu && on, drone: dr });
    }
    return out;
  },

  // densite moyenne d'une voix (frappes par mesure) sur le cycle du jour i : pour regler les seuils
  density(v, i) {
    const cy = Cycles.of(i), L = CFG.stepsPerMeasure;
    let h = 0, n = 0;
    for (let d = cy.start; d < cy.end; d++) { if (this.test(v, d, (d - cy.start) % L)) h++; n++; }
    return n ? h / n * L : NaN;
  },

  // ---- appels de Clock
  onStart() {
    this.meas = 0; this.rep = 0; this.pm = 0; this.g = 0; this.fillOn = false; this.bar0 = 0; this.mut = {};
    if (Silso.ready) this.metric(Silso.i, false);
  },
  onStop() { this.fillOn = false; Throw.flush(); if (Silso.ready) SUI.show(Silso.i); },

  onMeasure(t) {
    const R = CFG.rhythm;
    if (this.meas > 0 && R.follow && !this.ended && Silso.ready) {
      this.rep++;
      if (this.rep >= R.loop) {
        this.rep = 0;
        if (this.nextStart < 0) { this.ended = true; Clock.queue.push({ t, kind: 'day', i: Silso.i }); }   // fin des donnees : on tient
        else {
          Silso.i = this.nextStart;
          this.build(Silso.i);
          this.g = 0;
          Clock.queue.push({ t, kind: 'day', i: Silso.i });
        }
      }
    }
    const m = this.meas;
    this.pm = m % R.phrase;
    this.bar0 = m * CFG.stepsPerMeasure;
    if (Silso.ready) this.planDrone(m === 0);
    this.fillOn = false;
    this.mut = {};
    if (Silso.ready) {
      if (m > 0 && this.pm === 0) this.metric(Silso.i, true);
      // mutations aux mesures 4 et 8 ; a partir de l'etat 4, a la mesure 8 seulement
      const act = this.phrase ? this.phrase.act : 1;
      if ((this.pm + 1) % 4 === 0 && (act < 4 || this.pm === R.phrase - 1)) this.mutate();
      // fill : la mesure suivante est un repere de la forme, et l'etat va y changer
      if (R.fill && CFG.forme.auto && (m + 1) % CFG.forme.grid === 0) {
        const nx = (R.follow && !this.ended && this.rep + 1 >= R.loop && this.nextStart >= 0) ? this.nextStart : Silso.i;
        const k = Forme.target(nx);
        if (k !== null && Forme.cur !== null && k !== Forme.cur) this.fillOn = true;
      }
    }
    Clock.queue.push({ t, kind: 'pat' });              // la boucle de chaque voix avance
    this.meas++;
    Clock.queue.push({ t, kind: 'win', rep: this.rep, pm: this.pm });
  },

  // dernier pas joue par la voix v dans la mesure
  lastStep(v) {
    for (let s = CFG.stepsPerMeasure - 1; s >= 0; s--) if (this.plays(v, s)) return s;
    return -1;
  },

  // le pas s joue-t-il pour la voix v ?   base : sans le fill (affichage)
  plays(v, s, base) {
    if (v.id === 'kick' && this.droneOn()) {
      if (!this.droneSet) this.planDrone(true);
      if (this.droneSet.has(s)) return true;            // le drone ; le kick sec s'y ajoute
    }
    const P = this.pat[v.id]; if (!P) return false;
    const p = this.loopPos(v, s), mu = this.mut[v.id];
    let on = !!P[p];
    if (mu) { if (p === mu.from) on = false; if (p === mu.to) on = true; }
    if (!on && !base && this.fillOn && this.fillSet(v).includes(p)) on = true;
    return on;
  },

  onStep(t, s) {
    if (!Silso.ready) return;
    const sw = (s % 2) ? CFG.rhythm.swing * TICKS_PER_STEP * Clock.tickDur() : 0;   // shuffle
    const T = CFG.forme.throws, thr = Forme.throwsOn();
    CFG.rhythm.voices.forEach(v => {
      if (!v.on || !this.plays(v, s)) return;
      const d = this.days[s % this.days.length];
      if (thr) {                                       // dub throws : l'envoi s'ouvre avant la frappe
        if (v.id === 'snare' && (this.fillOn || (this.pm === CFG.rhythm.phrase - 1 && s === this.lastStep(v)))) Throw.fire(T.snare, t + sw);
        if (v.id === 'strega' && (this.pm + 1) % T.stregaEvery === 0) Throw.fire(T.strega, t + sw);
      }
      if (v.id === 'strega') {                         // la frappe de la Strega gonfle son activation
        Strega.hit(t + sw, d);
        Mon.voice(t + sw, v.id);
        return;
      }
      const g = (v.id === 'kick' && this.droneOn() && this.droneSet && this.droneSet.has(s)) ? this.droneSet.get(s) : v.gate;
      Mod.hit(v.id, t + sw, d);                        // SHELL : valeur propre a la frappe, avant le trigger
      Midi.note(CFG.rhythm.gateCh, v.out, 100, t + sw, g);
      Mon.voice(t + sw, v.id);
    });
  },

  // rampe des timbres : de la fenetre courante vers la suivante, sur la duree de la boucle
  onTick(t) {
    if (!Silso.ready) return;
    this.g++;
    if (!CFG.rhythm.follow) return;
    const total = CFG.rhythm.loop * CFG.stepsPerMeasure * TICKS_PER_STEP;
    const ph = Math.min(1, this.g / total);
    const j = (this.ended || this.nextStart < 0) ? Silso.i : this.nextStart;
    Mod.tick(Silso.i, j, ph, t);
  },

  // duree reelle : jours par mesure et duree d'un cycle au tempo
  daysPerMeasure() { return CFG.rhythm.slide / CFG.rhythm.loop; },
  measMs() { return CFG.stepsPerMeasure * TICKS_PER_STEP * Clock.tickDur(); }
};

/* ------------------------------------------- modulation des sorties de timbre */
// serie src normalisee 0-1 dans le cycle, inversee ou non, placee dans [lo, hi]
// (echelle CC 0-127), envoyee en 14 bits sur le canal du banc.
const Mod = {
  last: [],

  x(o, i) {
    const c = Strega.center(o.n, o);                // un timbre par phase (bloc Strega)
    if (!isNaN(c)) return c;
    const v = Cycles.norm(o.src, i, Cycles.of(i));
    return isNaN(v) ? NaN : (o.inv ? 1 - v : v);
  },
  value(o, x) {
    const cc = o.lo + (o.hi - o.lo) * x;
    return { cc, v14: Math.min(16383, Math.max(0, Math.round(cc / 127 * 16383))) };
  },

  tick(i, j, ph, t) {
    CFG.mod.forEach((o, k) => {
      if (!o.on || o.perHit) return;                   // les sorties par frappe bougent sur les frappes
      const a = this.x(o, i), b = this.x(o, j);
      let x = a;
      if (CFG.interp && !isNaN(a) && !isNaN(b)) x = a + (b - a) * ph;
      if (isNaN(x)) return;
      const { cc, v14 } = this.value(o, x);
      if (v14 === this.last[k]) return;
      this.last[k] = v14;
      Midi.cc14(o.cc, CFG.bench.ccCh, v14, t);
      Clock.queue.push({ t, kind: 'mod', k, x, cc, v14 });
    });
  },

  push(i, force) {
    if (!Silso.ready) return;
    const now = performance.now();
    CFG.mod.forEach((o, k) => {
      if (!o.on) return;
      const x = this.x(o, i); if (isNaN(x)) return;
      const { cc, v14 } = this.value(o, x);
      if (force || v14 !== this.last[k]) { this.last[k] = v14; Midi.cc14(o.cc, CFG.bench.ccCh, v14, now); }
      SUI.modShow(k, { x, cc, v14 });
    });
  },

  // ecart d'un jour pour la variation par frappe : (jour - moyenne 27 j) / max du lisse 13 mois, x 4, borne
  dayDev(d) {
    if (!(d >= 0)) return 0;
    const x = Series.vraw[d], a = Series.v27[d], m = Cycles.of(d).stats.s13.max;
    if (isNaN(x) || isNaN(a) || !(m > 0)) return 0;
    return Math.max(-1, Math.min(1, (x - a) / m * 4));
  },

  // frappe d'une voix : les sorties `perHit` de cette voix prennent une valeur propre a la frappe
  hit(id, t, d) {
    if (!Silso.ready) return;
    CFG.mod.forEach((o, k) => {
      if (!o.on || o.perHit !== id) return;
      const x0 = this.x(o, Silso.i); if (isNaN(x0)) return;
      const j = this.dayDev(d), x = clamp01(x0 + (o.jitter || 0) * j);
      const { cc, v14 } = this.value(o, x);
      this.last[k] = v14;
      Midi.cc14(o.cc, CFG.bench.ccCh, v14, t);
      Clock.queue.push({ t, kind: 'mod', k, x, cc, v14 });
    });
  },

  // le curseur du banc reprend la main sur la sortie n
  manual(n, v7) {
    const k = CFG.mod.findIndex(o => o.n === n); if (k < 0) return;
    const o = CFG.mod[k];
    if (o.on) { o.on = false; SUI.modState(k); }
    this.last[k] = v7 * 128;
    Midi.cc14(o.cc, CFG.bench.ccCh, v7 * 128);          // LSB 0 : valeur 7 bits exacte
    SUI.modShow(k, { x: NaN, cc: v7, v14: v7 * 128 });
  },

  isAuto(n) { const o = CFG.mod.find(m => m.n === n); return !!(o && o.on); }
};

/* ------------------------------------------------- forme : 5 etats */
// Une seule source de temps : Clock appelle onStart, onMeasure (premier pas de
// chaque mesure) et onTick. L'etat cible se lit sur la tete SILSO ; il n'est
// applique qu'aux mesures multiples de CFG.forme.grid, comptees depuis START.
// Une transition est une rampe lineaire, en ticks, de la valeur courante de chaque
// curseur du banc vers la valeur de l'etat.
// Reverbe longue dans toutes les phases (le drone), un peu plus courte quand le soleil
// monte ; les frappes y sont peu envoyees. La nappe figee (FSU) n'existe qu'au creux du minimum
// (13 mois normalise < CFG.forme.creux, a l'etat 1) ; le kick continue dessous.
// Le FSU part a la FIN de la rampe qui y mene (la cuve est pleine) et relache au
// debut de la suivante. Aux etats 2 a 5, les envois s'ouvrent en dub throws.
const Forme = {
  cur: null,        // etat applique (1-5), null avant la premiere application
  dir: 0,           // +1 montee, -1 descente (sens du dernier changement)
  meas: 0,          // mesures depuis START
  ramp: null,       // { to, items: [{ L, from, to, last }], done, ticks, fsuEnd }
  log: [],          // changements : { meas, from, to, auto } (affichage et tests)
  fsuLog: [],       // FSU : { meas, on } (affichage et tests)
  fullFrom: 0,      // mesure depuis laquelle les valeurs de l'etat sont atteintes en lecture
  defaults: null,   // copie des valeurs du fichier, pour « revenir »

  line(n) { return UI.bench && UI.bench.lines.find(L => L.n === n); },
  owns(n) { return CFG.forme.lignes.some(l => l.n === n); },
  row(id) { return CFG.forme.lignes.find(l => l.id === id || l.n === id); },
  key(l) { return l.n !== undefined ? l.n : l.id; },
  vals(l) { return l.v; },

  // etat cible : nombre de seuils franchis + 1
  target(i) {
    if (!Silso.ready) return null;
    const x = Cycles.norm(CFG.forme.src, i, Cycles.of(i));
    if (isNaN(x)) return null;
    return 1 + CFG.forme.seuils.filter(s => x >= s).length;
  },
  // creux du minimum : 13 mois normalise sous CFG.forme.creux
  creux(i) {
    if (!Silso.ready) return false;
    const x = Cycles.norm(CFG.forme.src, i, Cycles.of(i));
    return !isNaN(x) && x < CFG.forme.creux;
  },
  // FSU voulu a l'etat k : la case du tableau ; en automatique, au creux seulement
  fsuWanted(k, i) {
    const r = CFG.forme.lignes.find(l => l.gate);
    if (!r || !k || !this.vals(r)[k - 1]) return false;
    return CFG.forme.auto ? this.creux(i === undefined ? Silso.i : i) : true;
  },
  // les dub throws sont-ils permis a l'etat en cours ?
  throwsOn() {
    const r = this.row('throw');
    return !!(r && this.cur && this.vals(r)[this.cur - 1]);
  },
  // derniere valeur programmee d'une sortie de la forme (rampe en cours, sinon curseur)
  lastVal(n) {
    if (this.ramp) { const it = this.ramp.items.find(x => x.L.n === n); if (it) return it.last; }
    const L = this.line(n);
    return L && L.el ? +L.el.value : 0;
  },

  // ---- appels de Clock
  onStart() {
    this.meas = 0; this.fullFrom = 0;
    if (!CFG.forme.stopDry) return;
    // START : la reverbe reprend les valeurs de l'etat (coupees par le STOP)
    const now = performance.now();
    CFG.forme.lignes.filter(l => !l.gate && !l.flag).forEach(l => {
      const L = this.line(l.n); if (L) Midi.cc(UI.ccOf(L), CFG.bench.ccCh, this.lastVal(l.n), now);
    });
  },
  // STOP : Regen et envois a 0, FSU relache : la queue s'eteint. Les curseurs gardent
  // les valeurs de l'etat, renvoyees au START.
  onStop() {
    if (!CFG.forme.stopDry) return;
    const now = performance.now();
    [19, 13, 15, 16].forEach(n => { const L = this.line(n); if (L) Midi.cc(UI.ccOf(L), CFG.bench.ccCh, 0, now); });
    const F = this.line(17);
    if (F && UI.bench.held.has(17)) { this.fsuLog.push({ meas: this.meas - 1, on: false, stop: true }); this.fsu(F, false, now); }
    FUI.show();
  },
  onMeasure(t) {
    const m = this.meas++;
    if (!CFG.forme.auto || m % CFG.forme.grid !== 0) return;
    const k = this.target(Silso.i);
    if (k !== null && k !== this.cur) { this.go(k, true, t); return; }
    // meme etat : le creux peut commencer ou finir. On ne fige qu'une cuve remplie :
    // au moins une periode de grille jouee aux valeurs de l'etat
    if (k === null) return;
    const want = this.fsuWanted(k);
    if (!want || this.ramp || m - this.fullFrom >= CFG.forme.grid) this.fsuTo(want, t);
  },
  onTick(t) {
    Throw.tick(t);
    this.breathe(t);
    const R = this.ramp; if (!R) return;
    if (!R.started) { R.started = true; return; }   // tick de depart : la rampe finit pile sur une mesure
    R.done++;
    const p = Math.min(1, R.done / R.ticks);
    R.items.forEach(it => {
      const v = Math.round(it.from + (it.to - it.from) * p);
      if (v === it.last) return;
      it.last = v;
      if (Throw.busy(it.L.n, t)) return;              // un throw tient l'envoi : il rendra la derniere valeur
      Midi.send([0xb0 | ((CFG.bench.ccCh - 1) & 0x0f), UI.ccOf(it.L) & 0x7f, v & 0x7f], t);
      Clock.queue.push({ t, kind: 'forme', L: it.L, v });
    });
    if (p >= 1) {
      this.ramp = null; Clock.queue.push({ t, kind: 'forme', end: true });
      this.fullFrom = this.meas - 1;
      if (R.fsuEnd && this.fsuWanted(this.cur)) this.fsuTo(true, t);   // cuve pleine : on fige
    }
  },

  // respiration lente (CFG.forme.breath) : sinus autour de la valeur de l'etat, hors rampes
  breathe(t) {
    const B = CFG.forme.breath;
    if (!B || !this.cur || this.ramp) { this.bt = 0; return; }
    const a = B.amp[this.cur - 1] || 0;
    if (!(a > 0)) return;
    const l = this.row(B.n), L = this.line(B.n); if (!l || !L) return;
    this.bt = (this.bt || 0) + 1;
    const per = Math.max(1, B.bars * CFG.stepsPerMeasure * TICKS_PER_STEP);
    const v = Math.min(127, Math.max(0, Math.round(this.vals(l)[this.cur - 1] + a * Math.sin(2 * Math.PI * this.bt / per))));
    if (v === this.breathLast) return;
    this.breathLast = v;
    Midi.send([0xb0 | ((CFG.bench.ccCh - 1) & 0x0f), UI.ccOf(L) & 0x7f, v & 0x7f], t);
    Clock.queue.push({ t, kind: 'forme', L, v });
  },

  // FSU vers on/off ; on : a la fin de la rampe en cours s'il y en a une
  fsuTo(on, t) {
    const L = this.line(17), held = UI.bench && UI.bench.held.has(17);
    if (on === held) return;
    if (on && this.ramp && Clock.running) { this.ramp.fsuEnd = true; return; }
    this.fsuLog.push({ meas: this.meas - 1, on });
    if (t !== undefined) Clock.queue.push({ t, kind: 'forme', fsu: on, L });
    this.fsu(L, on, t);
    FUI.show();
  },

  // ---- aller a l'etat k : en lecture, rampe sur la grille ; a l'arret, tout de suite
  go(k, auto, t, prevItems, again) {
    const from = this.cur;
    if (from === k && !this.ramp && !again) { this.fsuTo(this.fsuWanted(k), Clock.running ? t : undefined); return; }
    UI.nappeStop();                                   // la sequence manuelle du gate 17 s'efface
    if (from !== k) {
      this.dir = from === null ? 0 : Math.sign(k - from) || this.dir;
      this.log.push({ meas: this.meas - 1, from, to: k, auto: !!auto });
    }
    this.cur = k;
    const fsuL = this.line(17);
    const fsuOn = this.fsuWanted(k);
    // point de depart de chaque rampe : la derniere valeur PROGRAMMEE si une rampe
    // tournait (le curseur affiche a jusqu'a 120 ms de retard sur l'ordonnanceur),
    // sinon la position du curseur
    const prev = new Map((prevItems || (this.ramp ? this.ramp.items : [])).map(it => [it.L, it.last]));
    const items = CFG.forme.lignes.filter(l => !l.gate && !l.flag).map(l => {
      const L = this.line(l.n); if (!L || !L.el) return null;
      const v0 = prev.has(L) ? prev.get(L) : +L.el.value;
      return { L, from: v0, to: this.vals(l)[k - 1], last: v0 };
    }).filter(Boolean);

    if (!Clock.running || t === undefined) {          // a l'arret : valeurs immediates
      this.ramp = null;
      items.forEach(it => this.set(it.L, it.to, true));
      // a l'arret, en automatique, on ne fige pas : la cuve est vide. Le FSU partira en
      // lecture, au repere qui suit une periode de grille jouee a l'etat 1
      this.fsu(fsuL, CFG.forme.auto ? false : fsuOn);
    } else {
      const pair = CFG.forme.rampPairs && from !== null ? CFG.forme.rampPairs[from + '-' + k] : undefined;
      const ticks = Math.max(1, Math.round((pair || CFG.forme.ramp) * CFG.stepsPerMeasure * TICKS_PER_STEP));
      this.ramp = { to: k, items, done: 0, ticks, fsuEnd: false };
      if (!fsuOn) this.fsuTo(false, t);               // on quitte le creux : le FSU relache au debut
      else this.ramp.fsuEnd = true;                    // on y entre : il part a la fin de la rampe
    }
    FUI.show();
  },

  // force a la main (boutons 1-5) : la forme passe en manuel
  force(k) {
    this.setAuto(false);
    this.go(k, false, Clock.running ? performance.now() + 10 : undefined);
  },

  setAuto(on) {
    CFG.forme.auto = on;
    FUI.show();
  },

  set(L, v, send) {
    L.el.value = v; L.val.textContent = String(v);
    if (send) Midi.cc(UI.ccOf(L), CFG.bench.ccCh, v);
  },

  fsu(L, on, t) {
    if (!L) return;
    const held = UI.bench.held.has(L.n);
    if (on && !held) { Midi.send([0x90 | ((CFG.bench.gateCh - 1) & 0x0f), L.n & 0x7f, 100], t === undefined ? performance.now() : t); UI.bench.held.add(L.n); }
    if (!on && held) { Midi.send([0x80 | ((CFG.bench.gateCh - 1) & 0x0f), L.n & 0x7f, 0], t === undefined ? performance.now() : t); UI.bench.held.delete(L.n); }
    const b = L.btn; if (b) b.classList.toggle('on', on);
    UI.benchInfo();
  },

  // un curseur du banc touche : la ligne sort de la rampe, la forme passe en manuel
  touched(L) {
    if (!this.owns(L.n)) return;
    if (this.ramp) this.ramp.items = this.ramp.items.filter(it => it.L !== L);
    if (CFG.forme.auto) this.setAuto(false);
  },

  // valeurs envoyees a l'ouverture du port MIDI (le FSU n'est pas un curseur)
  push() {
    const L = this.line(17);
    if (L && UI.bench.held.has(17)) { UI.bench.held.delete(17); this.fsu(L, true); }
  },

  // ---- memoire des valeurs reglees a l'oreille
  load() {
    if (!this.defaults) this.defaults = CFG.forme.lignes.map(l => l.v.slice());   // valeurs du fichier, une fois
    try {
      const s = localStorage.getItem(CFG.forme.storageKey); if (!s) return false;
      const m = JSON.parse(s);
      CFG.forme.lignes.forEach(l => { const id = this.key(l); if (Array.isArray(m[id]) && m[id].length === 5) l.v = m[id].map(Number); });
      return true;
    } catch (e) { return false; }
  },
  save() {
    const m = {}; CFG.forme.lignes.forEach(l => m[this.key(l)] = l.v);
    try { localStorage.setItem(CFG.forme.storageKey, JSON.stringify(m)); } catch (e) {}
  },
  reset() {
    CFG.forme.lignes.forEach((l, k) => l.v = this.defaults[k].slice());
    try { localStorage.removeItem(CFG.forme.storageKey); } catch (e) {}
  }
};

/* ------------------------------------------------------------ dub throws */
// L'envoi d'une voix (sortie 13 ou 15, CC du meme numero, canal du banc) s'ouvre a
// CFG.forme.throws.val pendant `steps` pas, puis revient a la valeur de la forme
// (derniere valeur programmee). Pendant un throw, la rampe de la forme continue
// en memoire mais n'ecrit pas sur cet envoi.
const Throw = {
  ends: new Map(),  // sortie -> fin du throw (ms)
  log: [],          // { n, t, meas } (tests)

  busy(n, t) { const e = this.ends.get(n); return e !== undefined && t < e; },

  send(n, v, t) { Midi.send([0xb0 | ((CFG.bench.ccCh - 1) & 0x0f), n & 0x7f, v & 0x7f], t); },

  fire(n, t) {
    const T = CFG.forme.throws, L = Forme.line(n);
    if (!L) return;
    const end = t + T.steps * TICKS_PER_STEP * Clock.tickDur();
    this.send(UI.ccOf(L), T.val, t);
    this.ends.set(n, Math.max(this.ends.get(n) || 0, end));
    this.log.push({ n, t, meas: Rhythm.meas - 1 });
    if (this.log.length > 400) this.log.splice(0, this.log.length - 400);
  },

  // a chaque tick : les throws qui finissent avant le tick suivant rendent la main
  tick(t) {
    const lim = t + Clock.tickDur();
    this.ends.forEach((e, n) => {
      if (e >= lim) return;
      this.ends.delete(n);
      const L = Forme.line(n); if (L) this.send(UI.ccOf(L), Forme.lastVal(n), Math.max(e, t));
    });
  },

  // arret : tous les envois reviennent tout de suite
  flush() {
    const now = performance.now();
    this.ends.forEach((e, n) => { const L = Forme.line(n); if (L) this.send(UI.ccOf(L), Forme.lastVal(n), now); });
    this.ends.clear();
  }
};

/* ------------------------------------------------------------------ Strega */
// Un drone dans toutes les phases et une percussion par phase (CFG.strega).
// La Strega (Make Noise) :
//   matiere de fond  : Activation CV, valeur de l'etat ponderee par la moyenne 27 j
//   frappes          : les frappes de la voix Strega (test « bouffee ») sont des gonflements
//                      de l'activation, qui retombent en exponentielle (courte un jour
//                      charge, longue un jour faible)
//   Decay CV         : repetitions longues au minimum, courtes au maximum
//   Filter CV        : s'ouvre avec le soleil, et suit la moyenne 27 j autour de l'etat
//   Tones CV         : une couleur par phase
// Les valeurs de l'etat sont lissees (CFG.strega.smooth mesures). Timbres du Kraken et du
// Chimera : un centre par phase (lignes t_*), l'ecart par frappe s'y ajoute (Mod).
// STOP : activation, decay et filtre a 0, la Strega se tait et ses repetitions s'eteignent.
const Strega = {
  env: [],          // frappes en cours : { t, a, tau }
  cur: { act: 0, dec: 0, fil: 0, ton: 0 },   // valeurs lissees 0-1 (hors frappes)
  last: {},         // sortie -> derniere valeur 14 bits envoyee
  lastT: null,      // date du dernier tick traite
  log: [],          // frappes : { t, a, tau, meas } (tests)
  defaults: null,

  row(key) { return CFG.strega.lignes.find(l => l.key === key); },
  st() { return Math.min(5, Math.max(1, Forme.cur || 1)); },
  val(key) { const r = this.row(key); return r ? r.v[this.st() - 1] : 0; },
  // plafonds de frappes d'une voix par etat
  max(id) { const r = CFG.strega.lignes.find(l => l.max && l.voice === id); return r ? r.v.slice() : null; },
  // timbre par phase d'une sortie de Mod (NaN : la serie SILSO decide), ramene a sa fenetre CC
  center(n, o) {
    const r = CFG.strega.lignes.find(l => l.mod === n); if (!r) return NaN;
    return clamp01((r.v[this.st() - 1] - o.lo) / Math.max(1, o.hi - o.lo));
  },
  s27() {
    const x = Silso.ready ? Cycles.norm('s27', Silso.i, Cycles.of(Silso.i)) : NaN;
    return isNaN(x) ? 0.5 : clamp01(x);
  },

  // cibles 0-1 de l'etat en cours
  targets() {
    const F = CFG.strega, x = this.s27();
    return {
      act: clamp01(this.val('s_act') / 127 * (1 - F.follow + F.follow * x)),
      dec: clamp01(this.val('s_decay') / 127),
      fil: clamp01((this.val('s_filter') + F.filterSpan * (x - 0.5)) / 127),
      ton: clamp01(this.val('s_tones') / 127)
    };
  },

  // force d'un jour : nombre de taches en fraction du maximum du lisse 13 mois du cycle
  dayQ(d) {
    if (!(d >= 0)) return 0;
    const x = Series.vraw[d], m = Cycles.of(d).stats.s13.max;
    return (isNaN(x) || !(m > 0)) ? 0 : clamp01(x / m);
  },

  // une frappe : hauteur et retombee tirees du jour
  hit(t, d) {
    const F = CFG.strega, q = this.dayQ(d);
    const a = this.val('s_swell') / 127 * (0.6 + 0.4 * q);
    if (!(a > 0)) return;
    const tau = F.swellMs[0] - (F.swellMs[0] - F.swellMs[1]) * q;
    this.env.push({ t, a, tau });
    this.log.push({ t, a, tau, meas: Rhythm.meas - 1 });
    if (this.log.length > 400) this.log.splice(0, this.log.length - 400);
    this.out(t, true);                                 // attaque a l'instant de la frappe
  },

  // somme des frappes en cours a la date t
  envAt(t) {
    let e = 0;
    this.env = this.env.filter(h => t - h.t < 6 * h.tau);
    this.env.forEach(h => { if (t >= h.t) e += h.a * Math.exp(-(t - h.t) / h.tau); });
    return e;
  },

  onTick(t) {
    if (!Silso.ready) return;
    const dt = this.lastT === null ? Infinity : t - this.lastT;
    this.lastT = t;
    const k = 1 - Math.exp(-dt / Math.max(1, CFG.strega.smooth * Rhythm.measMs()));
    const T = this.targets();
    ['act', 'dec', 'fil', 'ton'].forEach(n => { this.cur[n] += (T[n] - this.cur[n]) * k; });
    this.out(t);
    this.out(t + Clock.tickDur() / 2, true);           // retombee plus fine : deux valeurs par tick
  },

  out(t, actOnly) {
    const F = CFG.strega;
    // les frappes se logent dans la marge au-dessus du fond, saturation douce (jamais d'ecretage)
    const b = clamp01(this.cur.act), room = Math.max(1e-3, 1 - b);
    this.send(F.act, clamp01(b + room * Math.tanh(this.envAt(t) / room)), t);
    if (actOnly) return;
    this.send(F.decay, this.cur.dec, t);
    this.send(F.filter, this.cur.fil, t);
    this.send(F.tones, this.cur.ton, t);
  },

  send(o, x, t, force) {
    const v14 = Math.min(16383, Math.max(0, Math.round(x * 16383)));
    const p = this.last[o.n];
    if (!force && p !== undefined && (v14 === p || Math.abs(v14 - p) < (o.eps || 0))) return;
    this.last[o.n] = v14;
    Midi.cc14(o.cc, CFG.bench.ccCh, v14, t);
    Clock.queue.push({ t, kind: 'strega', n: o.n, x });
  },

  // la Strega se tait : activation, decay et filtre a 0 (le filtre ferme ne laisse presque
  // plus rien entrer dans l'echo : les repetitions s'eteignent vite)
  silence(t) {
    const F = CFG.strega, when = t === undefined ? performance.now() : t;
    this.env = [];
    this.send(F.act, 0, when, true);
    this.send(F.decay, 0, when, true);
    this.send(F.filter, 0, when, true);
    this.lastT = null;
  },

  onStart() { this.env = []; this.lastT = null; this.last = {}; },
  onStop() { this.silence(); SGUI.show(); },

  // ---- memoire des valeurs reglees a l'oreille
  load() {
    if (!this.defaults) this.defaults = CFG.strega.lignes.map(l => l.v.slice());   // valeurs du fichier, une fois
    try {
      const s = localStorage.getItem(CFG.strega.storageKey); if (!s) return false;
      const m = JSON.parse(s);
      CFG.strega.lignes.forEach(l => { if (Array.isArray(m[l.key]) && m[l.key].length === 5) l.v = m[l.key].map(Number); });
      return true;
    } catch (e) { return false; }
  },
  save() {
    const m = {}; CFG.strega.lignes.forEach(l => m[l.key] = l.v);
    try { localStorage.setItem(CFG.strega.storageKey, JSON.stringify(m)); } catch (e) {}
  },
  reset() {
    CFG.strega.lignes.forEach((l, k) => l.v = this.defaults[k].slice());
    try { localStorage.removeItem(CFG.strega.storageKey); } catch (e) {}
  }
};
