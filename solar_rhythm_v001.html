/* ---------------------------------------------------------------- traces */
const Plot = {
  ov: null, cv: null,
  ovCache: null, cvCache: null, cvCacheFor: '',
  dragging: false,

  init() {
    this.ov = $('ov'); this.cv = $('cv');
    const resize = () => { this.ovCache = null; this.cvCache = null; this.draw(SUI.cur); };
    window.addEventListener('resize', resize);
    this.bind(this.ov, $('ovTip'), (x, w) => Math.round(x / w * (Data.n - 1)), true);
    this.bind(this.cv, $('cvTip'), (x, w) => {
      const cy = Cycles.of(SUI.cur), P = this.cvPad;
      return cy.start + Math.round((x - P.l) / (w - P.l - P.r) * (cy.len - 1));
    }, false);
  },

  bind(cnv, tip, toIdx, drag) {
    const idxAt = e => {
      const r = cnv.getBoundingClientRect();
      return { i: toIdx(e.clientX - r.left, r.width), x: e.clientX - r.left, y: e.clientY - r.top, w: r.width };
    };
    cnv.addEventListener('mousedown', e => {
      const p = idxAt(e); if (p.i < 0 || p.i >= Data.n) return;
      Silso.seek(p.i); if (drag) this.dragging = cnv;
    });
    window.addEventListener('mouseup', () => this.dragging = false);
    cnv.addEventListener('mousemove', e => {
      const p = idxAt(e);
      if (this.dragging === cnv) Silso.seek(p.i);
      if (p.i < 0 || p.i >= Data.n) { tip.style.display = 'none'; return; }
      const r = Series.vraw[p.i];
      tip.innerHTML = Data.iso(p.i) + ' &middot; ' + t('cycle') + ' ' + Cycles.of(p.i).n +
        '<br><b>' + t('s_raw') + '</b> ' + (isNaN(r) ? t('missing') : r) +
        '  <b>' + t('s_s27') + '</b> ' + fmt(Series.s27[p.i], 1) + '  <b>' + t('s_s13') + '</b> ' + fmt(Series.s13[p.i], 1) +
        (Data.def[p.i] ? '' : '<br><b>' + t('provisional') + '</b>');
      tip.style.display = 'block';
      const tw = tip.offsetWidth;
      tip.style.left = Math.min(p.w - tw, Math.max(0, p.x + 12)) + 'px';
      tip.style.top = Math.max(0, p.y - 46) + 'px';
    });
    cnv.addEventListener('mouseleave', () => tip.style.display = 'none');
  },

  fit(cnv) {
    if (!cnv.dataset.h) cnv.dataset.h = cnv.getAttribute('height');   // hauteur logique, en px CSS
    const dpr = window.devicePixelRatio || 1, w = cnv.clientWidth, h = +cnv.dataset.h;
    if (cnv.width !== Math.round(w * dpr) || cnv.height !== Math.round(h * dpr)) {
      cnv.width = Math.round(w * dpr); cnv.height = Math.round(h * dpr);
      cnv.style.height = h + 'px';
    }
    const g = cnv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { g, w, h, dpr };
  },

  // enveloppe min-max du brut par colonne de pixels
  envelope(g, a, b, X, Y, w) {
    const cols = new Map();
    for (let i = a; i < b; i++) {
      const v = Series.vraw[i]; if (isNaN(v)) continue;
      const c = Math.floor(X(i));
      const e = cols.get(c);
      if (!e) cols.set(c, [v, v]); else { if (v < e[0]) e[0] = v; if (v > e[1]) e[1] = v; }
    }
    g.fillStyle = css('--s-raw');
    cols.forEach((e, c) => { const y1 = Y(e[1]), y0 = Y(e[0]); g.fillRect(c, y1, 1, Math.max(1, y0 - y1)); });
  },

  line(g, V, a, b, X, Y, color, step) {
    g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
    let pen = false;
    for (let i = a; i < b; i += step) {
      const v = V[i]; if (isNaN(v)) { pen = false; continue; }
      if (pen) g.lineTo(X(i), Y(v)); else { g.moveTo(X(i), Y(v)); pen = true; }
    }
    const v = V[b - 1]; if (pen && !isNaN(v)) g.lineTo(X(b - 1), Y(v));
    g.stroke();
  },

  draw(i) {
    if (!Data.n) return;
    this.drawOv(i); this.drawCv(i);
  },

  // ---- vue d'ensemble : 1818 -> fin des donnees
  drawOv(i) {
    const { g, w, h, dpr } = this.fit(this.ov);
    const cy = Cycles.of(i);
    if (!this.ovCache || this.ovCacheFor !== cy.n + ':' + w) {
      const top = 16, bot = 4, ymax = 540;
      const X = k => k / (Data.n - 1) * (w - 1);
      const Y = v => top + (1 - v / ymax) * (h - top - bot);
      g.clearRect(0, 0, w, h);
      g.fillStyle = 'rgba(255,138,61,.07)';
      g.fillRect(X(cy.start), 0, X(cy.end - 1) - X(cy.start), h);
      this.envelope(g, 0, Data.n, X, Y, w);
      this.line(g, Series.v13, 0, Data.n, X, Y, css('--s-13'), 10);
      g.font = '10px ' + css('--mono'); g.textAlign = 'center';
      Cycles.list.forEach(c => {
        g.fillStyle = '#2a2f36'; g.fillRect(Math.round(X(c.start)), 0, 1, h);
        g.fillStyle = c === cy ? css('--accent') : css('--dim');
        g.fillText(c.n, X((c.start + c.end) / 2), 11);
      });
      this.ovCache = g.getImageData(0, 0, Math.round(w * dpr), Math.round(h * dpr));
      this.ovCacheFor = cy.n + ':' + w;
    } else {
      g.putImageData(this.ovCache, 0, 0);
    }
    const x = Math.round(i / (Data.n - 1) * (w - 1));
    g.fillStyle = css('--head'); g.fillRect(x, 0, 1.5, h);
  },

  // ---- vue du cycle courant
  cvPad: { l: 40, r: 12, t: 12, b: 22 },
  drawCv(i) {
    const { g, w, h, dpr } = this.fit(this.cv);
    const cy = Cycles.of(i), P = this.cvPad;
    const ymax = Math.max(50, Math.ceil(cy.stats.raw.max * 1.05 / 50) * 50);
    const X = k => P.l + (k - cy.start) / Math.max(1, cy.len - 1) * (w - P.l - P.r);
    const Y = v => P.t + (1 - v / ymax) * (h - P.t - P.b);
    const key = cy.n + ':' + w + ':' + I18N.lang;
    if (!this.cvCache || this.cvCacheFor !== key) {
      g.clearRect(0, 0, w, h);
      g.font = '10px ' + css('--mono');
      // grille horizontale
      const stepY = ymax > 300 ? 100 : 50;
      g.textAlign = 'right'; g.textBaseline = 'middle';
      for (let v = 0; v <= ymax; v += stepY) {
        g.fillStyle = '#22272d'; g.fillRect(P.l, Math.round(Y(v)), w - P.l - P.r, 1);
        g.fillStyle = css('--dim'); g.fillText(v, P.l - 6, Y(v));
      }
      // annees
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      const y0 = Data.ymd(cy.start)[0], y1 = Data.ymd(cy.end - 1)[0];
      for (let y = y0 + 1; y <= y1; y++) {
        const k = Data.idx(y, 1, 1), x = X(k);
        g.fillStyle = '#22272d'; g.fillRect(Math.round(x), P.t, 1, h - P.t - P.b);
        g.fillStyle = css('--dim'); g.fillText(y, x, h - 6);
      }
      // zone provisoire
      let p0 = -1;
      for (let k = cy.start; k < cy.end; k++) if (!Data.def[k]) { p0 = k; break; }
      if (p0 >= 0) {
        g.fillStyle = 'rgba(255,138,61,.08)';
        g.fillRect(X(p0), P.t, X(cy.end - 1) - X(p0) + 1, h - P.t - P.b);
        g.fillStyle = css('--accent'); g.textAlign = 'right';
        g.fillText(t('provisional'), w - P.r - 2, P.t + 10);
      }
      this.envelope(g, cy.start, cy.end, X, Y, w);
      this.line(g, Series.v27, cy.start, cy.end, X, Y, css('--s-27'), 1);
      this.line(g, Series.v13, cy.start, cy.end, X, Y, css('--s-13'), 1);
      // seuils des 5 etats de la forme, sur l'echelle du lisse 13 mois de ce cycle
      const s13 = cy.stats[CFG.forme.src];
      g.setLineDash([3, 4]); g.lineWidth = 1; g.strokeStyle = 'rgba(221,106,34,.45)';
      g.font = '10px ' + css('--mono'); g.textAlign = 'left'; g.fillStyle = css('--s-13');
      CFG.forme.seuils.forEach((sv, k) => {
        const yy = Math.round(Y(s13.min + sv * (s13.max - s13.min))) + 0.5;
        g.beginPath(); g.moveTo(P.l, yy); g.lineTo(w - P.r, yy); g.stroke();
        g.fillText(t('state') + ' ' + (k + 2), P.l + 4, yy - 3);
      });
      g.setLineDash([]);
      this.cvCache = g.getImageData(0, 0, Math.round(w * dpr), Math.round(h * dpr));
      this.cvCacheFor = key;
    } else {
      g.putImageData(this.cvCache, 0, 0);
    }
    // fenetre en cours : bande de N jours a partir de la tete
    const xe = X(Math.min(cy.end - 1, i + CFG.stepsPerMeasure - 1));
    g.fillStyle = 'rgba(230,233,236,.10)'; g.fillRect(X(i), P.t, Math.max(1.5, xe - X(i)), h - P.t - P.b);
    // tete
    const x = X(i);
    g.fillStyle = css('--head'); g.fillRect(Math.round(x), P.t, 1.5, h - P.t - P.b);
    [['raw', '--txt'], ['s27', '--s-27'], ['s13', '--s-13']].forEach(([k, c]) => {
      const v = Series.held(k, i); if (isNaN(v)) return;
      g.beginPath(); g.arc(x, Y(v), 4, 0, 7);
      g.fillStyle = css(c); g.fill();
      g.lineWidth = 2; g.strokeStyle = css('--panel'); g.stroke();
    });
  }
};



/* -------------------------------------------------------------------- UI */
const NOTE_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const nn = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

// note MIDI -> tension sur une sortie FH-2 (1 V/oct, note 60 au centre de la plage)
const RANGES = {
  '0-5':  { lo: 0,  hi: 5,  centre: 2.5, label: '0-5 V'  },
  '0-10': { lo: 0,  hi: 10, centre: 5,   label: '0-10 V' },
  'pm5':  { lo: -5, hi: 5,  centre: 0,   label: '±5 V'   }
};
const rng = () => RANGES[CFG.out.range] || RANGES['0-5'];
const voltsI = n => rng().centre + (n - 60) / 12;
const volts = n => Math.min(rng().hi, Math.max(rng().lo, voltsI(n)));
const clipped = n => Math.abs(voltsI(n) - volts(n)) > 1e-9;
const coarse = n => Math.round(127 * (volts(n) - rng().lo) / (rng().hi - rng().lo));
const degNote = d => {
  const sc = CFG.scale; if (!sc.length) return CFG.root;
  return Math.min(127, Math.max(0, sc[Math.min(sc.length, Math.max(1, d)) - 1] + CFG.root));
};

// banc de test des sorties d'expander : une ligne par sortie (cle de description : b_l + n)
const BENCH_LINES = [
  { n:  9, t: 'gate' },
  { n: 10, t: 'cv', v: 0 },
  { n: 11, t: 'gate' },
  { n: 12, t: 'gate' },
  { n: 13, t: 'cv', v: 102 },
  { n: 14, t: 'cv', v: 0, mod: true },
  { n: 15, t: 'cv', v: 102 },
  { n: 16, t: 'cv', v: 0 },
  { n: 17, t: 'gate', nappe: true },
  { n: 18, t: 'cv', v: 0 },
  { n: 19, t: 'cv', v: 0, regen: true },
  { n: 20, t: 'cv', v: 102, vol: true },
  { n: 21, t: 'cv', v: 64, cc: 25, mod: true },
  { n: 22, t: 'cv', v: 64 },
  { n: 23, t: 'cv', v: 102, vol: true },
  { n: 24, t: 'cv', v: 102, vol: true }
];

const UI = {
  cells: [],
  bench: null,

  init() {
    // ---- langue
    document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => I18N.set(b.dataset.lang));

    // ---- transport
    $('play').onclick = () => { if (CFG.monitor) Mon.ensure(); Clock.toggle(); };
    $('panic').onclick = () => { this.benchAllOff(); Midi.panic(); };
    $('mon').onclick = e => { CFG.monitor = !CFG.monitor; e.target.classList.toggle('on', CFG.monitor); if (CFG.monitor) Mon.ensure(); };
    $('sendClock').onclick = e => { CFG.sendClock = !CFG.sendClock; e.target.classList.toggle('on', CFG.sendClock); };
    const setBpm = v => {
      CFG.bpm = Math.min(300, Math.max(20, Number(v) || 120));
      $('bpm').value = CFG.bpm; $('bpmSl').value = Math.round(CFG.bpm);
      this.timings();
    };
    $('bpmSl').oninput = e => setBpm(e.target.value);
    $('bpm').oninput = e => setBpm(e.target.value);
    document.querySelectorAll('[data-steps]').forEach(b => {
      b.onclick = () => {
        const n = Number(b.dataset.steps);
        CFG.stepsPerMeasure = n; CFG.melDiv = n / 4;
        $('melDiv').value = CFG.melDiv;
        document.querySelectorAll('[data-steps]').forEach(x => x.classList.toggle('on', x === b));
        Rhythm.rebuild(); SUI.voices(); SUI.show(SUI.cur);
        this.melInfo();
      };
    });
    $('port').onchange = e => Midi.select(e.target.value);

    // ---- clavier : Espace = transport ; la tete SILSO est geree par SUI
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
        e.preventDefault(); if (CFG.monitor) Mon.ensure(); Clock.toggle();
      }
    });

    // ---- melodie
    $('scale').oninput = e => {
      const v = e.target.value.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
      if (v.length) { CFG.scale = v; if (CFG.walkMax > v.length) $('wmax').value = CFG.walkMax = v.length; this.melNames(); }
    };
    $('rootSl').oninput = e => { CFG.root = +e.target.value; this.melNames(); };
    $('wmin').oninput = e => { CFG.walkMin = Math.max(1, +e.target.value || 1); this.melNames(); };
    $('wmax').oninput = e => { CFG.walkMax = Math.max(1, +e.target.value || 1); this.melNames(); };
    $('wspan').oninput = e => { CFG.walkSpan = +e.target.value; $('wspanVal').textContent = '±' + CFG.walkSpan; this.melNames(); };
    $('melDiv').oninput = e => { CFG.melDiv = Math.max(1, Number(e.target.value) || 1); this.melInfo(); };
    $('melState').onclick = () => { CFG.melState = !CFG.melState; this.melInfo(); };
    $('melSrc').onclick = () => { CFG.melSrc = CFG.melSrc === 'data' ? 'walk' : 'data'; this.melInfo(); };
    $('orange').onchange = e => { CFG.out.range = e.target.value; this.melNames(); };
    $('winLo').oninput = e => { CFG.out.winLo = +e.target.value || 0; this.melNames(); };
    $('winHi').oninput = e => { CFG.out.winHi = +e.target.value || 0; this.melNames(); };

    // ---- banc
    $('tgCh').oninput = e => CFG.bench.gateCh = Math.min(16, Math.max(1, +e.target.value || 1));
    $('tcCh').oninput = e => { CFG.bench.ccCh = Math.min(16, Math.max(1, +e.target.value || 1)); SUI.modInfo(); };
    $('allOff').onclick = () => this.benchAllOff();
    $('pushCV').onclick = () => this.benchPushCV();
    $('napBuild').oninput = e => CFG.nappe.buildMeas = Math.max(0, +e.target.value || 0);
    $('napRegen').oninput = e => CFG.nappe.regenCap = Math.min(127, Math.max(0, +e.target.value || 0));
    $('napDown').oninput = e => CFG.nappe.downMeas = Math.max(0.25, +e.target.value || 4);
    $('napUp').oninput = e => CFG.nappe.upMeas = Math.max(0.25, +e.target.value || 1);

    this.buildBench();
    this.relabel();
    requestAnimationFrame(() => this.frame());
  },

  // textes dynamiques (au demarrage et a chaque changement de langue)
  relabel() {
    this.transport(Clock.running);
    this.timings(); this.melInfo(); this.melNames();
    this.afTable();
    if (this.bench) { this.buildBench(); }
    if (Midi.out) this.midiStatus(t('midi_connected') + Midi.out.name, 'ok');
    else if (!Midi.access) this.midiStatus(t('midi_init'), '');
  },

  outName(n) {
    if (n <= 8) return 'FH-2 · ' + n;
    if (n <= 16) return '8CV n°1 · ' + (n - 8);
    if (n <= 24) return '8CV n°2 · ' + (n - 16);
    if (n <= 32) return '8CV n°3 · ' + (n - 24);
    return t('virtual');
  },
  ccOf(L) { return (L.cc !== undefined) ? L.cc : L.n; },

  // ---- banc de test des sorties 9 a 24
  buildBench() {
    const keep = this.bench ? new Map(this.bench.lines.map(L => [L.n, L.el ? +L.el.value : null])) : null;
    const held = this.bench ? this.bench.held : new Set();
    const fade = this.bench ? this.bench.fade : null;
    const LINES = BENCH_LINES.map(l => Object.assign({}, l));
    this.bench = { lines: LINES, held, fade };
    const tb = $('bench'); tb.innerHTML = '';
    LINES.forEach(L => {
      const tr = document.createElement('tr');
      const oc = document.createElement('td'); oc.className = 'o';
      oc.innerHTML = '<div class="nm">' + this.outName(L.n) + ' <span class="gn">(' + L.n + ')</span></div>';
      const ds = document.createElement('div'); ds.className = 'ds'; ds.textContent = t('b_l' + L.n); oc.appendChild(ds);
      const cc = document.createElement('td'); cc.className = 'ctl';
      if (L.t === 'gate') {
        const b = document.createElement('button');
        b.className = 'gt' + (held.has(L.n) ? ' on' : ''); b.textContent = 'gate'; L.btn = b;
        b.onclick = () => {
          const on = !b.classList.contains('on');
          b.classList.toggle('on', on);
          if (L.nappe) { Forme.touched(L); Forme.ramp = null; this.nappeFade(on); return; }   // geste manuel : la forme lache
          if (on) { Midi.holdOn(CFG.bench.gateCh, L.n); this.bench.held.add(L.n); }
          else    { Midi.holdOff(CFG.bench.gateCh, L.n); this.bench.held.delete(L.n); }
          this.benchInfo();
        };
        cc.appendChild(b);
      } else {
        const w = document.createElement('div'); w.className = 'cv';
        const r = document.createElement('input');
        const dv = (keep && keep.get(L.n) !== null && keep.get(L.n) !== undefined) ? keep.get(L.n) : L.v;
        r.type = 'range'; r.min = 0; r.max = 127; r.step = 1; r.value = dv;
        if (L.mod && Mod.isAuto(L.n)) r.classList.add('auto');
        if (Forme.owns(L.n)) r.classList.add('forme');
        const v = document.createElement('span'); v.textContent = String(dv);
        r.oninput = () => {
          v.textContent = r.value;
          if (L.mod) Mod.manual(L.n, +r.value);                   // le SILSO lache la sortie
          else Midi.cc(this.ccOf(L), CFG.bench.ccCh, +r.value);
          if (this.bench.fade) this.bench.fade.items = this.bench.fade.items.filter(it => it.L !== L);
          Forme.touched(L);                                       // la forme passe en manuel
        };
        w.appendChild(r); w.appendChild(v); cc.appendChild(w);
        L.el = r; L.val = v;
      }
      tr.appendChild(oc); tr.appendChild(cc); tb.appendChild(tr);
    });
    // la rampe en cours (forme) reference les anciennes lignes : on la rattache aux nouvelles
    if (Forme.ramp) Forme.ramp.items.forEach(it => { it.L = LINES.find(L => L.n === it.L.n) || it.L; });
    if (fade) fade.items.forEach(it => { it.L = LINES.find(L => L.n === it.L.n) || it.L; });
    this.benchInfo();
  },

  benchInfo() {
    const h = [...this.bench.held].sort((a, b) => a - b);
    $('benchInfo').innerHTML = h.length ? t('b_held') + ' <b>' + h.join(' · ') + '</b>' : t('b_none');
  },

  // relache les gates et ramene les CV a leurs valeurs par defaut (pas a zero :
  // un CV a 0 ferme le canal 3 du Praga et coupe les envois)
  benchAllOff() {
    this.nappeStop();
    Forme.ramp = null; Forme.cur = null; Forme.setAuto(false);    // retour aux valeurs du banc, hors etats
    this.bench.held.forEach(n => Midi.holdOff(CFG.bench.gateCh, n));
    this.bench.held.clear();
    document.querySelectorAll('#bench button.gt').forEach(b => b.classList.remove('on'));
    this.bench.lines.forEach(L => {
      if (L.t === 'cv' && L.el && !(L.mod && Mod.isAuto(L.n))) {   // une sortie sous SILSO garde sa valeur
        L.el.value = L.v; L.val.textContent = String(L.v);
        if (L.mod) Mod.manual(L.n, L.v); else Midi.cc(this.ccOf(L), CFG.bench.ccCh, L.v);
      }
    });
    this.benchInfo();
  },

  // envoie les CV du banc a leur valeur courante (ouverture du port MIDI)
  benchPushCV() {
    this.bench.lines.forEach(L => {
      if (L.t !== 'cv' || !L.el || (L.mod && Mod.isAuto(L.n))) return;   // le SILSO envoie les siennes
      if (L.mod) Mod.manual(L.n, +L.el.value); else Midi.cc(this.ccOf(L), CFG.bench.ccCh, +L.el.value);
    });
  },

  // ---- transition rythme -> nappe a la main (gate 17) : montee du Regen, puis FSU et descente des vol
  measMs() { return CFG.stepsPerMeasure * TICKS_PER_STEP * Clock.tickDur(); },
  nappeFade(on) {
    this.nappeStop();
    const N = CFG.nappe, mm = this.measMs();
    const vols = this.bench.lines.filter(L => L.vol && L.el);
    const regen = this.bench.lines.filter(L => L.regen && L.el);
    const fsuL = this.bench.lines.find(L => L.nappe);
    const seq = { on, phases: [], i: 0, items: [], id: 0, name: '' };
    if (on) {
      if (N.buildMeas > 0 && regen.length)
        seq.phases.push({ name: 'b_ph_build', dur: N.buildMeas * mm, targets: regen.map(L => [L, N.regenCap]) });
      seq.phases.push({ name: 'b_ph_down', dur: N.downMeas * mm, targets: vols.map(L => [L, 0]), start: () => this.fsu(fsuL, true) });
    } else {
      this.fsu(fsuL, false);
      seq.phases.push({ name: 'b_ph_up', dur: N.upMeas * mm, targets: vols.map(L => [L, L.v]).concat(regen.map(L => [L, L.v])) });
    }
    this.bench.fade = seq;
    this.nappeRun();
  },
  nappeRun() {
    const seq = this.bench.fade; if (!seq) return;
    const P = seq.phases[seq.i];
    if (!P) { this.nappeStop(true); return; }
    if (P.start) P.start();
    seq.name = P.name;
    seq.items = P.targets.map(([L, to]) => ({ L, from: +L.el.value, to, last: +L.el.value }));
    const t0 = performance.now(), dur = Math.max(1, P.dur);
    const step = () => {
      if (this.bench.fade !== seq) return;
      const k = Math.min(1, (performance.now() - t0) / dur);
      seq.items.forEach(it => {
        const val = Math.round(it.from + (it.to - it.from) * k);
        if (val !== it.last) {
          it.last = val; it.L.el.value = val; it.L.val.textContent = String(val);
          Midi.cc(this.ccOf(it.L), CFG.bench.ccCh, val);
        }
      });
      this.nappeInfo(k);
      if (k >= 1) { clearInterval(seq.id); seq.i++; this.nappeRun(); }
    };
    seq.id = setInterval(step, 20);
    step();
  },
  fsu(L, on) {
    if (!L) return;
    if (on) { Midi.holdOn(CFG.bench.gateCh, L.n); this.bench.held.add(L.n); }
    else if (this.bench.held.has(L.n)) { Midi.holdOff(CFG.bench.gateCh, L.n); this.bench.held.delete(L.n); }
    this.benchInfo();
  },
  nappeStop(done) {
    const f = this.bench && this.bench.fade;
    if (!f) return;
    clearInterval(f.id);
    this.bench.fade = null;
    this.nappeInfo(done ? 1 : null, f.on);
  },
  nappeInfo(k, wasOn) {
    const el = $('nappeInfo'), f = this.bench.fade;
    if (f) el.innerHTML = t(f.name) + ' ' + Math.round(k * 100) + '&nbsp;%';
    else if (k === 1) el.innerHTML = wasOn ? t('b_nappe_on') : t('b_nappe_off');
    else el.innerHTML = '';
  },

  // ---- affectations des sorties
  afTable() {
    const rows = [
      [1, 'af_1'], [2, 'af_2'], [3, 'af_3'], [4, 'af_4'], [5, 'af_5'], [6, 'af_6'], [7, 'af_7'], [8, 'af_8'],
      [9, 'af_9'], ['11 / 12', 'af_11'], [13, 'af_13'], ['15 / 16', 'af_15'], ['10 / 14', 'af_10'],
      [17, 'af_17'], ['18 / 19', 'af_18'], [20, 'af_20'], [21, 'af_21'], ['22 / 23', 'af_22'], [24, 'af_24'],
      ['26 / 27', 'af_26'], ['28 / 29', 'af_28'], [65, 'af_65']
    ];
    const name = n => {
      if (typeof n === 'number') return n <= 8 ? 'FH-2 · ' + n : n === 65 ? t('virtual') + ' <span class="gn">(65)</span>'
        : this.outName(n) + ' <span class="gn">(' + n + ')</span>';
      const [a, b] = n.split(' / ').map(Number);
      return this.outName(a) + ' / ' + (this.outName(b).split(' · ')[1]) + ' <span class="gn">(' + n + ')</span>';
    };
    $('afTable').innerHTML = rows.map(([n, k]) => '<tr><td>' + name(n) + '</td><td>' + t(k) + '</td></tr>').join('');
  },

  // ---- melodie et sortie FH-2 · 7
  voltMap() {
    const lo = Math.min(CFG.walkMin, CFG.walkMax), hi = Math.max(CFG.walkMin, CFG.walkMax), W = CFG.out;
    $('winName').textContent = nn(W.winLo) + ' → ' + nn(W.winHi);
    let rows = '<tr><td>' + t('v_deg') + '</td><td>' + t('v_note') + '</td><td>' + t('v_volt') + '</td><td>coarse</td><td></td></tr>';
    let inWin = 0, total = 0, anyClip = false;
    for (let d = lo; d <= Math.min(hi, CFG.scale.length); d++) {
      const n = degNote(d), v = volts(n), c = coarse(n);
      const cut = clipped(n), win = n >= W.winLo && n <= W.winHi;
      total++; if (win && !cut) inWin++; if (cut) anyClip = true;
      const cls = cut ? 'bad' : (win ? 'ok' : 'warn');
      const tag = cut ? t('v_clip') : (win ? t('v_in') : t('v_out'));
      rows += '<tr><td>' + d + '</td><td>' + n + ' ' + nn(n) + '</td><td>' + v.toFixed(2) + ' V</td><td>' + c + '</td><td class="' + cls + '">' + tag + '</td></tr>';
    }
    $('voltTable').innerHTML = rows;
    let sum = t('v_sum', { a: inWin, b: total, r: rng().label });
    if (anyClip) sum += ' &middot; <b class="bad">' + t('v_sum_clip') + '</b>';
    else if (inWin < total) sum += ' &middot; <b class="warn">' + t('v_sum_root') + '</b>';
    else sum += ' &middot; <b class="ok">' + t('v_sum_ok') + '</b>';
    $('voltSum').innerHTML = sum;
  },
  melNames() {
    const sc = CFG.scale, n = sc.length;
    const lo = Math.min(CFG.walkMin, CFG.walkMax), hi = Math.max(CFG.walkMin, CFG.walkMax);
    $('rootVal').textContent = CFG.root + '  ' + nn(CFG.root);
    $('scaleNames').innerHTML = sc.map((iv, i) => {
      const d = i + 1, inR = d >= lo && d <= hi;
      return (inR ? '<i>' : '') + d + ':' + nn(degNote(d)) + (inR ? '</i>' : '');
    }).join('  ');
    $('wminName').textContent = nn(degNote(lo));
    $('wmaxName').textContent = nn(degNote(hi));
    const semis = degNote(hi) - degNote(lo), deg = hi - lo + 1;
    $('ambit').innerHTML = t('m_ambit', { a: nn(degNote(lo)), b: nn(degNote(hi)), d: deg, s: semis, o: (semis / 12).toFixed(2) }) +
      (hi > n ? ' &middot; ' + t('m_out', { n }) : '');
    this.voltMap();
  },
  melInfo() {
    const n = CFG.melDiv > 0 ? (CFG.stepsPerMeasure / CFG.melDiv) : 0;
    $('melInfo').textContent = CFG.melState ? t('m_by_state', { b: CFG.melBars.map(x => x === 0.5 ? '½' : x).join(' · ') })
      : t('m_per_meas', { n: Math.round(n * 100) / 100 });
    $('melState').classList.toggle('on', !!CFG.melState);
    $('melSrc').classList.toggle('on', CFG.melSrc === 'data');
    $('melSrc').textContent = t(CFG.melSrc === 'data' ? 'mel_src_data' : 'mel_src_walk');
    $('melDiv').disabled = !!CFG.melState;
    this.timings();
  },

  timings() {
    const tk = Clock.tickDur();
    $('tickms').textContent = tk.toFixed(3) + ' ms';
    $('stepms').textContent = (tk * TICKS_PER_STEP).toFixed(1) + ' ms';
    $('measms').textContent = (tk * TICKS_PER_STEP * CFG.stepsPerMeasure / 1000).toFixed(3) + ' s';
    SUI.timing();
  },

  transport(on) {
    const b = $('play');
    b.textContent = on ? 'STOP' : 'START';
    b.classList.toggle('on', on);
    if (!on) document.querySelectorAll('#rGrid td.now').forEach(c => c.classList.remove('now'));
    SUI.state();
  },

  // consomme la file d'evenements a l'instant reel ; un affichage par image
  frame() {
    const now = performance.now(), q = Clock.queue;
    let day = null, step = null;
    while (q.length && q[0].t <= now) {
      const e = q.shift();
      if (e.kind === 'day') day = e;
      else if (e.kind === 'step') { step = e; if (e.note !== null && e.note !== undefined) this.showNote(e.note); }
      else if (e.kind === 'win') SUI.winInfo(e.rep, e.pm);
      else if (e.kind === 'pat') SUI.grid();
      else if (e.kind === 'mod') SUI.modShow(e.k, e);
      else if (e.kind === 'forme') {
        if (e.L && e.v !== undefined) Forme.set(e.L, e.v, false);
        if (e.end || e.fsu !== undefined) FUI.show();
      }
    }
    if (day) SUI.show(day.i);
    if (step) SUI.playhead(step.step);
    if (q.length > 600) q.splice(0, q.length - 600);
    requestAnimationFrame(() => this.frame());
  },

  showNote(note) {
    const v = volts(note), c = coarse(note), cut = clipped(note), nd = $('noteDisp');
    nd.textContent = note;
    nd.style.color = cut ? 'var(--red)' : (note >= CFG.out.winLo && note <= CFG.out.winHi ? 'var(--green)' : 'var(--accent)');
    $('noteName').textContent = nn(note) + '  ' + v.toFixed(2) + ' V  c' + c;
  },

  fillPorts(list, sel) {
    const s = $('port'); s.innerHTML = '';
    if (!list.length) { s.innerHTML = '<option>(' + t('none') + ')</option>'; return; }
    list.forEach(o => {
      const op = document.createElement('option');
      op.value = o.id; op.textContent = o.name + (o.manufacturer ? ' · ' + o.manufacturer : '');
      if (o.id === sel) op.selected = true;
      s.appendChild(op);
    });
  },
  midiStatus(txt, cls) { const el = $('midistat'); el.textContent = 'Web MIDI : ' + txt; el.className = cls || ''; }
};

/* ------------------------------------------------------- affichage SILSO */
const SUI = {
  cur: 0,
  shownCycle: null,
  rows: [],

  init() {
    const fill = (id, vals, cur, lab) => {
      const s = $(id); s.innerHTML = '';
      vals.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = lab(v); if (v === cur) o.selected = true; s.appendChild(o); });
    };
    this.fillWin = () => {
      fill('rLoop', [1, 2, 4, 8], CFG.rhythm.loop, v => t(v > 1 ? 'meas_n' : 'meas_1', { n: v }));
      fill('rSlide', [1, 2, 4, 8, 16], CFG.rhythm.slide, v => t(v > 1 ? 'days_n' : 'days_1', { n: v }));
      fill('rPhrase', [4, 8, 16], CFG.rhythm.phrase, v => t('meas_n', { n: v }));
    };
    this.fillWin();
    $('rLoop').onchange = e => { CFG.rhythm.loop = +e.target.value; this.timing(); this.modeUI(); };
    $('rSlide').onchange = e => { CFG.rhythm.slide = +e.target.value; Rhythm.rebuild(); this.timing(); this.grid(); this.modeUI(); };
    $('rPhrase').onchange = e => { CFG.rhythm.phrase = +e.target.value; Rhythm.rebuild(); this.modeUI(); this.grid(); };
    $('rFill').onclick = () => { CFG.rhythm.fill = !CFG.rhythm.fill; if (!CFG.rhythm.fill) Rhythm.fillOn = false; this.modeUI(); this.grid(); };
    $('rSwing').oninput = e => { CFG.rhythm.swing = Math.min(0.3, Math.max(0, (+e.target.value || 0) / 100)); this.modeUI(); };

    $('bk1').onclick = () => Silso.step(-1);   $('fw1').onclick = () => Silso.step(1);
    $('bk27').onclick = () => Silso.step(-27); $('fw27').onclick = () => Silso.step(27);
    $('home').onclick = () => Silso.seek(Cycles.of(this.cur).start);
    $('loop').onclick = () => this.setLoop(!CFG.silso.loop);
    $('span').onclick = () => this.setSpan(!CFG.silso.span.on);
    $('follow').onclick = () => this.setFollow(!CFG.rhythm.follow);
    $('interp').onclick = () => { CFG.interp = !CFG.interp; this.interpBtn(); };
    $('goDate').onchange = e => {
      const p = e.target.value.split('-').map(Number);
      if (p.length === 3 && p[0]) Silso.seek(Data.idx(p[0], p[1], p[2]));
    };
    document.addEventListener('keydown', e => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || !Silso.ready) return;
      const k = e.code;
      if (k === 'ArrowRight')     { e.preventDefault(); Silso.step(e.shiftKey ? 27 : 1); }
      else if (k === 'ArrowLeft') { e.preventDefault(); Silso.step(e.shiftKey ? -27 : -1); }
      else if (k === 'PageDown')  { e.preventDefault(); Silso.cycle(1); }
      else if (k === 'PageUp')    { e.preventDefault(); Silso.cycle(-1); }
      else if (k === 'Home')      { e.preventDefault(); Silso.seek(Cycles.of(this.cur).start); }
      else if (k === 'KeyB')      this.setLoop(!CFG.silso.loop);
      else if (k === 'KeyR')      this.setSpan(!CFG.silso.span.on);
      else if (k === 'KeyF')      this.setFollow(!CFG.rhythm.follow);
      else if (k === 'KeyN')      Silso.phase(e.shiftKey ? -1 : 1);
    });

    // depot d'un CSV plus recent
    const drop = $('drop');
    ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    document.addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
    document.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('over');
      const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) App.loadFile(f);
    });
    $('file').onchange = e => { const f = e.target.files[0]; if (f) App.loadFile(f); e.target.value = ''; };
    $('forget').onclick = () => App.forget();

    this.buildMods();
    this.voices();
    this.relabel();
    Plot.init();
  },

  relabel() {
    if (this.fillWin) this.fillWin();
    this.setLoop(CFG.silso.loop); this.setSpan(CFG.silso.span.on); this.setFollow(CFG.rhythm.follow);
    this.interpBtn();
    this.modeUI();
    this.buildMods(); this.voices();
    if (Silso.ready) { this.rebuild(); this.show(this.cur); Mod.push(this.cur); }   // valeurs des timbres reaffichees
  },

  // reglages du rythme : boutons, curseur et texte d'aide
  modeUI() {
    const R = CFG.rhythm;
    $('rFill').classList.toggle('on', !!R.fill);
    $('rSwing').value = Math.round(R.swing * 100);
    $('rSwingV').textContent = Math.round(R.swing * 100) + ' %';
    const d = Math.max(CFG.stepsPerMeasure, Math.round(R.phrase * Rhythm.daysPerMeasure()));
    $('rHint').innerHTML = t('rh_hint', { p: R.phrase, d, m: R.morph });
  },

  interpBtn() {
    $('interp').classList.toggle('on', CFG.interp);
    $('interp').textContent = CFG.interp ? t('mod_ramp') : t('mod_steps');
  },
  setLoop(on) {
    CFG.silso.loop = on;
    $('loop').classList.toggle('on', on);
    $('loop').textContent = on ? t('cy_loop_on') : t('cy_loop');
    if (Silso.ready) { Rhythm.ended = false; Rhythm.rebuild(); this.cycleTags(Cycles.of(this.cur)); }
  },
  setSpan(on) {
    const S = CFG.silso.span;
    S.on = on;
    $('span').classList.toggle('on', on);
    $('span').textContent = t('cy_span', { a: S.from, b: S.to }) + (on ? t('active') : '');
    if (Silso.ready) { Rhythm.ended = false; Rhythm.rebuild(); this.cycleTags(Cycles.of(this.cur)); }
  },
  setFollow(on) {
    CFG.rhythm.follow = on;
    $('follow').classList.toggle('on', on);
    $('follow').textContent = on ? t('hd_follow') : t('hd_frozen');
    this.state();
  },

  state() {
    const el = $('sState'); if (!el) return;
    el.textContent = !Silso.ready ? '' : Rhythm.ended ? t('st_end') : !CFG.rhythm.follow ? t('st_frozen')
      : Clock.running ? t('st_play') : t('st_stop');
  },

  // vitesse de lecture : jours par mesure, duree d'un cycle au tempo
  timing() {
    if (!Silso.ready) return;
    const R = CFG.rhythm, cy = Cycles.of(this.cur), dpm = Rhythm.daysPerMeasure(), mm = Rhythm.measMs();
    $('dayMs').textContent = t('hd_speed_v', { d: fmt(dpm, dpm % 1 ? 2 : 0), b: fmt(dpm / (CFG.stepsPerMeasure / 4), 2) });
    $('cycDur').textContent = fmtDur(cy.len / dpm * mm / 1000) + ' (' + nfmt(cy.len) + ' ' + t('days_abbr') + ')';
  },

  // ---- grille du rythme : une ligne par voix, une colonne par pas (numero du pas en tete) ;
  // cases jaunes = mutation, bleues = fill, cases du drone pour le Crater
  grid() {
    const L = CFG.stepsPerMeasure;
    const cols = Array.from({ length: L }, (_, s) => s);
    let h = '<tr class="days"><td class="lb">' + t('rh_step') + '</td>' + cols.map(s =>
      '<td class="c' + (s % 4 === 0 ? ' q' : '') + '" data-s="' + s + '">' + (s + 1) + '</td>').join('') + '</tr>';
    CFG.rhythm.voices.forEach(v => {
      const B = Rhythm.barHits(v), I = Rhythm.info[v.id];
      const cnt = I ? ' <span class="gn">· ' + I.played + '/' + I.len + '</span>' : '';
      h += '<tr' + (v.on ? '' : ' class="off"') + '><td class="lb">' + v.name + ' <span class="gn">' + v.input + '</span>' + cnt + '</td>' +
        cols.map(s => {
          const cls = B[s].on ? ' on' + (B[s].mut ? ' mut' : '') + (B[s].drone ? ' drone' : '') : (B[s].fill ? ' fill' : '');
          return '<td class="c' + (s % 4 === 0 ? ' q' : '') + cls + '" data-s="' + s + '"></td>';
        }).join('') + '</tr>';
    });
    $('rGrid').innerHTML = h;
    this.winInfo(Rhythm.rep, Rhythm.pm);
  },
  playhead(s) {
    document.querySelectorAll('#rGrid td.now').forEach(c => c.classList.remove('now'));
    document.querySelectorAll('#rGrid tr:not(.days) td[data-s="' + s + '"]').forEach(c => c.classList.add('now'));
  },
  winInfo(rep, pm) {
    const D = Rhythm.days.filter(d => d >= 0);
    if (!D.length) return;
    const P = Rhythm.phrase;
    if (P) {
      const PD = P.days.filter(d => d >= 0);
      $('rInfo').textContent = t('rh_info_met', { a: Data.iso(PD[0]), b: Data.iso(PD[PD.length - 1]), d: P.n,
        r: (pm || 0) + 1, n: CFG.rhythm.phrase, k: P.act });
    }
    $('hWin').textContent = Data.iso(D[0]) + ' → ' + Data.iso(D[D.length - 1]);
  },

  // ---- reglages des voix
  voices() {
    const box = $('rVoices'); if (!box) return;
    box.innerHTML = '';
    this.vrows = [];
    CFG.rhythm.voices.forEach(v => {
      const d = document.createElement('div'); d.className = 'voice';
      d.innerHTML =
        '<div class="vn">' + UI.outName(v.out) + ' → ' + v.name + ' <code>' + v.input + '</code><small>' + t('v_' + v.id) + '</small></div>' +
        '<div class="vc"><button></button>' +
          '<select>' + TESTS.map(k => '<option value="' + k + '">' + t('test_' + k) + '</option>').join('') + '</select>' +
          t('rh_th') + ' <input type="number" min="0" max="1" step="0.01">' +
          '<label><input type="checkbox"> ' + t('rh_anchor') + '</label>' +
          '<span' + (v.gate ? '' : ' style="display:none"') + '>gate <input type="number" min="1" max="500" step="1"> ms</span></div>' +
        '<div class="vd"></div>';
      box.appendChild(d);
      const q = s => d.querySelector(s);
      const R = { btn: q('.vc button'), test: q('select'), th: q('input[type=number]'), anchor: q('input[type=checkbox]'),
                  gate: d.querySelectorAll('input[type=number]')[1], dens: q('.vd') };
      this.vrows.push(R);
      R.test.value = v.test; R.th.value = v.th.toFixed(2); R.anchor.checked = v.anchor; R.gate.value = v.gate;
      const upd = () => { Rhythm.rebuild(); this.grid(); this.density(); };
      R.btn.onclick = () => { v.on = !v.on; this.voiceBtn(v, R); this.grid(); };
      R.test.onchange = () => { v.test = R.test.value; upd(); };
      R.th.oninput = () => { v.th = Math.max(0, +R.th.value || 0); upd(); };
      R.anchor.onchange = () => { v.anchor = R.anchor.checked; upd(); };
      R.gate.oninput = () => { v.gate = Math.min(500, Math.max(1, +R.gate.value || 20)); };
      this.voiceBtn(v, R);
    });
    this.density();
  },
  voiceBtn(v, R) { R.btn.textContent = v.on ? 'ON' : 'OFF'; R.btn.classList.toggle('on', v.on); },
  density() {
    if (!Silso.ready || !this.vrows) return;
    CFG.rhythm.voices.forEach((v, k) => {
      const x = Rhythm.density(v, this.cur);
      this.vrows[k].dens.innerHTML = t('rh_dens', { x: '<b>' + fmt(x, 1) + '</b>', c: Cycles.of(this.cur).n, n: CFG.stepsPerMeasure });
    });
  },

  // ---- sorties de timbre
  buildMods() {
    const box = $('modRows'); box.innerHTML = ''; this.rows = [];
    CFG.mod.forEach((o, k) => {
      const d = document.createElement('div'); d.className = 'mod';
      d.innerHTML =
        '<div class="mh"><span class="nm">' + UI.outName(o.n) + ' <span class="gn">(' + o.n + ')</span></span>' +
        '<span class="ds">' + o.name + ' · CC ' + o.cc + '/' + (o.cc + 32) + '</span><button></button></div>' +
        '<div class="mc">' + t('mod_src') + ' <select>' +
          SERIES.map(S => '<option value="' + S.key + '">' + t('s_' + S.key) + '</option>').join('') +
        '</select> ' + t('mod_lo') + ' <input type="number" min="0" max="127" step="1"> ' + t('mod_hi') +
        ' <input type="number" min="0" max="127" step="1"> <button>' + t('mod_inv') + '</button></div>' +
        '<div class="mbar"><i class="win"></i><i class="pos"></i></div>' +
        '<div class="mval"><span>0-1 <b>–</b></span><span>CC <b>–</b></span><span>14 bits <b>–</b></span></div>';
      box.appendChild(d);
      const q = s => d.querySelectorAll(s);
      const R = { el: d, btn: q('.mh button')[0], src: q('select')[0], lo: q('input')[0], hi: q('input')[1],
                  inv: q('.mc button')[0], win: q('.win')[0], pos: q('.pos')[0], vals: q('.mval b') };
      this.rows.push(R);
      R.src.value = o.src; R.lo.value = o.lo; R.hi.value = o.hi;
      const changed = () => { this.modWin(k); if (!Clock.running || !CFG.rhythm.follow) Mod.push(this.cur); };
      R.btn.onclick = () => { o.on = !o.on; Mod.last[k] = undefined; this.modState(k); if (o.on && (!Clock.running || !CFG.rhythm.follow)) Mod.push(this.cur, true); };
      R.src.onchange = () => { o.src = R.src.value; changed(); };
      R.lo.oninput = () => { o.lo = Math.min(127, Math.max(0, +R.lo.value || 0)); changed(); };
      R.hi.oninput = () => { o.hi = Math.min(127, Math.max(0, +R.hi.value || 0)); changed(); };
      R.inv.onclick = () => { o.inv = !o.inv; changed(); };
      this.modState(k); this.modWin(k);
    });
    this.modInfo();
  },
  modInfo() { $('modInfo').textContent = t('mod_info', { a: CFG.mod.filter(m => m.on).length, b: CFG.mod.length, c: CFG.bench.ccCh }); },
  modState(k) {
    const o = CFG.mod[k], R = this.rows[k]; if (!R) return;
    R.btn.textContent = o.on ? 'SILSO' : t('manual');
    R.btn.classList.toggle('on', o.on);
    R.el.classList.toggle('off', !o.on);
    const L = UI.bench && UI.bench.lines.find(l => l.n === o.n);
    if (L && L.el) L.el.classList.toggle('auto', o.on);
    this.modInfo();
  },
  modWin(k) {
    const o = CFG.mod[k], R = this.rows[k];
    const a = Math.min(o.lo, o.hi), b = Math.max(o.lo, o.hi);
    R.win.style.left = (a / 127 * 100) + '%'; R.win.style.width = ((b - a) / 127 * 100) + '%';
    R.inv.className = 'seg' + (o.inv ? ' on' : '');
  },
  modShow(k, e) {
    const R = this.rows[k]; if (!R) return;
    R.pos.style.left = (e.cc / 127 * 100) + '%';
    R.vals[0].textContent = fmt(e.x, 3); R.vals[1].textContent = fmt(e.cc, 1); R.vals[2].textContent = e.v14;
    const L = UI.bench && UI.bench.lines.find(l => l.n === CFG.mod[k].n);
    if (L && L.el && CFG.mod[k].on) { L.el.value = Math.round(e.cc); L.val.textContent = String(Math.round(e.cc)); }
  },

  // ---- donnees et cycles
  rebuild() {
    const g = $('cycGrid'); g.innerHTML = '';
    Cycles.list.forEach(cy => {
      const b = document.createElement('button');
      b.textContent = cy.n; b.dataset.n = cy.n;
      if (cy.partial || cy.ongoing) b.classList.add('part');
      b.title = cy.partial ? t('cy_partial_t') : cy.ongoing ? t('cy_ongoing_t') : Data.iso(cy.start) + ' → ' + Data.iso(cy.end - 1);
      b.onclick = () => Silso.seek(cy.start);
      g.appendChild(b);
    });
    this.dataPanel();
    Plot.ovCache = null; Plot.cvCache = null;
    this.shownCycle = null;
  },
  dataPanel() {
    const embedded = Data.origin === 'embedded';
    $('dSrc').textContent = (embedded ? t('d_embedded') : Data.origin === 'stored' ? t('d_stored') : t('d_dropped')) + ' · ' + Data.name;
    $('dSpan').textContent = Data.iso(0) + ' → ' + Data.iso(Data.n - 1) + ' · ' + nfmt(Data.n) + ' ' + t('days_abbr');
    const V = Data.verify();
    $('checks').innerHTML = V.list.map(c => {
      const cls = c.ok ? 'ok' : (embedded ? 'bad' : 'warn');
      return '<div class="kv"><span>' + c.label + '</span><span class="' + cls + '">' + (c.ok ? c.got + ' ✓' : c.got + ' (ref. ' + c.exp + ')') + '</span></div>';
    }).join('');
    const nbad = V.list.filter(c => !c.ok).length;
    $('dropMsg').innerHTML = nbad ? '<span class="warn">' + t('d_diff', { n: nbad }) + (embedded ? '' : t('d_diff_newer')) + '</span>'
      : '<span class="ok">' + t('d_allok') + '</span>';
    $('ovInfo').textContent = Data.iso(0) + ' → ' + Data.iso(Data.n - 1);
    $('forget').style.display = embedded ? 'none' : '';
  },
  cycleTags(cy) {
    const tg = [], S = CFG.silso, ym = a => t('months')[a[1] - 1] + ' ' + a[0];
    if (cy.partial) tg.push('<span class="tag prov">' + t('cy_partial', { m: ym(cy.off.min), d: Data.iso(0) }) + '</span>');
    if (cy.ongoing) tg.push('<span class="tag prov">' + t('cy_ongoing') + '</span>');
    if (S.loop) tg.push('<span class="tag info">' + t('cy_tag_loop', { n: cy.n }) + '</span>');
    else if (S.span.on) tg.push('<span class="tag info">' + t('cy_tag_span', { a: S.span.from, b: S.span.to }) + '</span>');
    $('cycTags').innerHTML = tg.join('');
  },

  show(i) {
    this.cur = i;
    const cy = Cycles.of(i), ym = a => t('months')[a[1] - 1] + ' ' + a[0];
    const r = Series.vraw[i], held = Series.raw[i], hf = Series.heldFrom[i];
    $('hDate').textContent = Data.iso(i);
    if (document.activeElement !== $('goDate')) $('goDate').value = Data.iso(i);
    $('hIdx').textContent = nfmt(i + 1) + ' / ' + nfmt(Data.n);
    $('hVal').textContent = isNaN(r) ? (isNaN(held) ? '–' : held) : r;
    $('hVal').style.color = isNaN(r) ? 'var(--red)' : 'var(--txt)';
    const tags = [];
    tags.push(Data.def[i] ? '<span class="tag def">' + t('definitive') + '</span>' : '<span class="tag prov">' + t('provisional') + '</span>');
    if (isNaN(r)) tags.push('<span class="tag miss">' + t('missing') + (hf >= 0 ? ' · ' + t('held_from', { d: Data.iso(hf) }) : '') + '</span>');
    if (Series.f27[i] === 1) tags.push('<span class="tag info">' + t('trunc27') + '</span>');
    if (Series.f13[i]) tags.push('<span class="tag info">' + t('trunc13') + '</span>');
    $('hTags').innerHTML = tags.join('');
    $('h2713').textContent = fmt(Series.s27[i], 1) + ' · ' + fmt(Series.s13[i], 1);

    if (this.shownCycle !== cy) {
      this.shownCycle = cy;
      document.querySelectorAll('#cycGrid button').forEach(b => b.classList.toggle('on', +b.dataset.n === cy.n));
      $('cycTitle').textContent = t('cycle') + ' ' + cy.n + (cy.partial ? ' (' + t('partial') + ')' : cy.ongoing ? ' (' + t('ongoing') + ')' : '');
      this.cycleTags(cy);
      const o = cy.off;
      $('cStart').textContent = ym(o.min) + (cy.partial ? ' (' + t('before_data') + ')' : ' · ' + Data.iso(cy.start)) + ' · SN ' + fmt(o.minSN, 1);
      $('cEnd').textContent = cy.ongoing ? t('cy_end_ongoing', { d: Data.iso(Data.n - 1) }) : Data.iso(cy.end - 1);
      const m13 = cy.stats.s13;
      $('cMax').innerHTML = ym(o.max) + ' · ' + fmt(o.maxSN, 1) +
        ' <span style="color:var(--dim)">(' + t('recomputed') + ' ' + fmt(m13.max, 1) + ', ' + (m13.maxI >= 0 ? ym(Data.ymd(m13.maxI)) : '–') + ')</span>';
      this.stats(cy);
      this.timing();
      this.density();
    }
    const p = i - cy.start;
    $('cPos').textContent = t('cy_pos_v', { d: nfmt(p + 1), n: nfmt(cy.len), pc: (100 * p / Math.max(1, cy.len - 1)).toFixed(1), y: (p / 365.25).toFixed(2) });
    $('cBar').style.width = (100 * (p + 1) / cy.len) + '%';
    $('cvInfo').textContent = t('cycle') + ' ' + cy.n + ' · ' + Data.iso(cy.start) + ' → ' + Data.iso(cy.end - 1);
    SERIES.forEach(S => {
      const a = $('cur_' + S.key); if (a) a.textContent = fmt(Series.held(S.key, i), S.dec);
      const b = $('nrm_' + S.key); if (b) b.textContent = fmt(Cycles.norm(S.key, i, cy), 3);
    });
    this.grid();
    this.state();
    Plot.draw(i);
    FUI.show();
  },

  stats(cy) {
    const rows = SERIES.map(S => {
      const st = cy.stats[S.key], d = k => k >= 0 ? '<small>' + Data.iso(k) + '</small>' : '';
      return '<tr><td><span class="sw" style="background:var(' + S.color + ')"></span>' + t('s_' + S.key) + '</td>' +
        '<td>' + fmt(st.min, S.dec) + d(st.minI) + '</td><td>' + fmt(st.max, S.dec) + d(st.maxI) + '</td>' +
        '<td>' + fmt(st.mean, 1) + '</td><td id="cur_' + S.key + '">–</td><td id="nrm_' + S.key + '">–</td></tr>';
    }).join('');
    const nmiss = cy.len - cy.stats.raw.count;
    $('stTable').innerHTML = '<tr><th>' + t('st_series') + '</th><th>min</th><th>max</th><th>' + t('st_mean') + '</th><th>' + t('st_head') + '</th><th>0-1</th></tr>' + rows +
      '<tr><td colspan="6" style="text-align:left;color:var(--dim);font-size:11px">' + t('st_foot', { n: nfmt(cy.len), v: nfmt(cy.stats.raw.count) }) +
      (nmiss ? ' · <span class="bad">' + t('st_miss', { n: nfmt(nmiss) }) + '</span>' : '') + '</td></tr>';
  }
};

/* ------------------------------------------------------------ chargement */
const App = {
  embedded: null,

  use(d, origin) {
    Data.set(d, origin);
    Series.build();
    Cycles.build();
    SUI.rebuild();
  },

  init() {
    this.embedded = Data.parsePack($('silso-data').textContent);
    let d = this.embedded, origin = 'embedded';
    try {
      const s = localStorage.getItem(CFG.silso.storageKey);
      if (s) {
        const m = Data.parsePack(s);
        const endOf = x => Date.UTC(x.start[0], x.start[1] - 1, x.start[2]) + (x.raw.length - 1) * DAY_MS;
        if (endOf(m) > endOf(d)) { d = m; origin = 'stored'; }
        else localStorage.removeItem(CFG.silso.storageKey);
      }
    } catch (e) { /* stockage indisponible : donnees integrees */ }
    SUI.init();
    this.use(d, origin);
    Silso.ready = true;
    Forme.load(); FUI.init();
    Strega.load(); SGUI.init();
    const c = Cycles.byN(CFG.silso.startCycle) || Cycles.list[0];
    Silso.seek(c.start);
    Mod.push(c.start, true);
    const k = Forme.target(c.start);
    if (CFG.forme.auto && k) Forme.go(k, true);
  },

  loadFile(f) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = Data.parseCSV(String(r.result), f.name);
        const keep = Data.iso(SUI.cur);
        this.use(d, 'dropped');
        try { localStorage.setItem(CFG.silso.storageKey, Data.toPack(d)); } catch (e) {}
        const p = keep.split('-').map(Number), i = Data.idx(p[0], p[1], p[2]);
        Silso.seek(i >= 0 && i < Data.n ? i : 0);
      } catch (e) {
        $('dropMsg').innerHTML = '<span class="bad">' + t('d_refused') + e.message + '</span>';
      }
    };
    r.readAsText(f);
  },

  forget() {
    try { localStorage.removeItem(CFG.silso.storageKey); } catch (e) {}
    const keep = SUI.cur;
    this.use(this.embedded, 'embedded');
    Silso.seek(Math.min(keep, Data.n - 1));
  }
};


/* ------------------------------------------------------------- demarrage */
I18N.init();
UI.init();
Midi.init().then(() => {
  UI.benchPushCV();                          // CV du banc, pour que le systeme ne demarre pas muet
  if (Silso.ready) Mod.push(SUI.cur, true);  // les trois timbres SILSO
  Forme.push();                              // FSU haut si l'etat courant est 5
});
// le bloc de donnees SILSO est place apres ce script : on attend la fin de l'analyse
document.addEventListener('DOMContentLoaded', () => App.init());

</script>
